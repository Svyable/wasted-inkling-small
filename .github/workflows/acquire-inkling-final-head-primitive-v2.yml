name: Acquire bounded Inkling final-head primitive fixture v2

on:
  push:
    branches:
      - agent/inkling-final-head-primitive
    paths:
      - ".github/workflows/acquire-inkling-final-head-primitive-v2.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: acquire-inkling-final-head-primitive-v2
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      ONEDNN_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/inkling-final-head-primitive
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned official stack
        run: python3 -m pip install --quiet --break-system-packages 'torch==2.13.0' 'transformers==5.14.1'

      - name: Recover proven layer-5 hidden state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/source-artifact"
          gh run download 31451503885 \
            --repo "$GITHUB_REPOSITORY" \
            --name checked-bf16-local-global-31451503885-1 \
            --dir "${RUNNER_TEMP}/source-artifact"
          test -f "${RUNNER_TEMP}/source-artifact/local-global-trace/expected/layer-5/output.bf16.bin"

      - name: Fetch bounded head tensors and freeze official primitive
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/mvp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import struct
          from pathlib import Path

          import torch
          import torch.nn.functional as F
          from transformers.models.inkling.modeling_inkling import InklingRMSNorm
          from inkling_remote_fixture_core import HttpRanges, RemoteSafetensors

          revision = '21152b5312c653be115f33a8342759064144e281'
          model = 'thinkingmachines/Inkling-Small'
          config_sha = 'dcb5b1d587bce2f1e6b29833d739a724d05b4bfaa2dc1164fbe679330478ba53'
          index_sha = '68b1ab9dade825da1d9d162303f7356167ba2b90fd2c5fdf519e898d45adb0d9'
          layer5_full_sha = '4218f9ff2c97dd409ca5c8e82dec4e4de52a0024f1cb2c8c4fd185a81eb38978'
          hidden_row_sha = 'b6a560aa44b26561ee0b08dd0b438fa06ef2c29685b5e28e96ab1e6bd7aef88a'
          hidden_size = 4096
          semantic_vocab = 200058
          eps = 1e-6
          width = 16.0
          row_ids = list(range(8)) + list(range(100025, 100033)) + list(range(200050, 200058))
          assert row_ids and min(row_ids) >= 0 and max(row_ids) < semantic_vocab

          artifact = Path(os.environ['RUNNER_TEMP']) / 'source-artifact' / 'local-global-trace' / 'expected' / 'layer-5' / 'output.bf16.bin'
          full = artifact.read_bytes()
          assert len(full) == 8 * hidden_size * 2
          assert hashlib.sha256(full).hexdigest() == layer5_full_sha
          hidden_raw = full[7 * hidden_size * 2: 8 * hidden_size * 2]
          assert hashlib.sha256(hidden_raw).hexdigest() == hidden_row_sha

          source = HttpRanges(f'https://huggingface.co/{model}', revision)
          config_raw = source.file('config.json')
          index_raw = source.file('model.safetensors.index.json')
          assert hashlib.sha256(config_raw).hexdigest() == config_sha
          assert hashlib.sha256(index_raw).hexdigest() == index_sha
          reader = RemoteSafetensors(source, index_raw)

          norm_loc = reader.location('model.llm.norm.weight')
          head_loc = reader.location('model.llm.unembed.weight')
          assert norm_loc.dtype == 'BF16' and norm_loc.shape == (hidden_size,)
          assert head_loc.dtype == 'BF16'
          assert len(head_loc.shape) == 2 and head_loc.shape[1] == hidden_size
          storage_vocab = int(head_loc.shape[0])
          assert storage_vocab >= semantic_vocab
          norm_raw = source.read_range(norm_loc.shard, norm_loc.offset, norm_loc.size)
          row_bytes = hidden_size * 2
          assert head_loc.size == storage_vocab * row_bytes
          rows_raw = b''.join(
              source.read_range(head_loc.shard, head_loc.offset + row * row_bytes, row_bytes)
              for row in row_ids
          )
          assert len(rows_raw) == len(row_ids) * row_bytes

          def bf16(raw: bytes, shape: tuple[int, ...]) -> torch.Tensor:
              values = torch.frombuffer(bytearray(raw), dtype=torch.uint16).clone()
              return values.view(torch.bfloat16).reshape(shape)

          hidden = bf16(hidden_raw, (1, hidden_size))
          norm_weight = bf16(norm_raw, (hidden_size,))
          rows = bf16(rows_raw, (len(row_ids), hidden_size))

          norm = InklingRMSNorm(hidden_size, eps=eps).eval()
          with torch.no_grad():
              norm.weight.copy_(norm_weight)
              final_norm = norm(hidden)
              scaled = final_norm / width
              logits = F.linear(scaled, rows)
          assert final_norm.dtype == torch.bfloat16
          assert scaled.dtype == torch.bfloat16
          assert logits.dtype == torch.bfloat16

          def raw_bf16(t: torch.Tensor) -> bytes:
              return t.detach().cpu().contiguous().view(torch.uint16).numpy().astype('<u2', copy=False).tobytes()

          fixture = Path('tests/fixtures/inkling/final_head_primitive_real')
          fixture.mkdir(parents=True, exist_ok=True)
          files = {
              'input-layer5-pos7.bf16.bin': hidden_raw,
              'final-norm-weight.bf16.bin': norm_raw,
              'selected-unembed-rows.bf16.bin': rows_raw,
              'selected-row-ids.u32.bin': struct.pack(f'<{len(row_ids)}I', *row_ids),
              'expected-final-norm.bf16.bin': raw_bf16(final_norm),
              'expected-final-norm-scaled.bf16.bin': raw_bf16(scaled),
              'expected-selected-logits.bf16.bin': raw_bf16(logits),
          }
          for name, payload in files.items():
              (fixture / name).write_bytes(payload)

          provenance = {
              'format': 'inkling-final-head-primitive-real',
              'version': 2,
              'model_id': model,
              'revision': revision,
              'config_sha256': config_sha,
              'index_sha256': index_sha,
              'source_hidden': {
                  'workflow_run_id': 31451503885,
                  'artifact_id': 9086582184,
                  'artifact_zip_sha256': '17912d4c28ec633ef07443def743716f146e62ffecfab34d73a62dcc851d5351',
                  'full_layer5_output_sha256': layer5_full_sha,
                  'position': 7,
                  'row_sha256': hidden_row_sha,
                  'claim': 'real proven layer-5 output test vector; not the final model hidden state',
              },
              'profile': {
                  'torch': torch.__version__,
                  'transformers': '5.14.1',
                  'onednn_max_cpu_isa': os.environ.get('ONEDNN_MAX_CPU_ISA'),
                  'rms_eps': eps,
                  'logits_mup_width_multiplier': width,
              },
              'source_tensors': {
                  'final_norm': {
                      'name': norm_loc.name, 'shard': norm_loc.shard,
                      'dtype': norm_loc.dtype, 'shape': list(norm_loc.shape),
                      'offset': norm_loc.offset, 'size': norm_loc.size,
                  },
                  'unembed': {
                      'name': head_loc.name, 'shard': head_loc.shard,
                      'dtype': head_loc.dtype,
                      'storage_shape': list(head_loc.shape),
                      'semantic_vocab_size': semantic_vocab,
                      'storage_vocab_size': storage_vocab,
                      'offset': head_loc.offset, 'size': head_loc.size,
                      'row_bytes': row_bytes,
                      'selected_rows': row_ids,
                  },
              },
              'network': {'bytes_read': source.bytes_read, 'requests': source.requests},
              'files': {
                  name: {'bytes': len(payload), 'sha256': hashlib.sha256(payload).hexdigest()}
                  for name, payload in files.items()
              },
              'non_claims': [
                  'input is not the true final layer-41 hidden state',
                  'selected semantic rows are not full final-model logits',
                  'padded storage rows outside semantic vocab are not scored',
                  'no public runtime execution is promoted by this fixture',
              ],
          }
          (fixture / 'provenance.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          print('FINAL_HEAD_FIXTURE ' + json.dumps({
              'rows': len(row_ids),
              'storage_vocab': storage_vocab,
              'semantic_vocab': semantic_vocab,
              'payload_bytes': sum(len(v) for v in files.values()),
              'network_bytes': source.bytes_read,
              'requests': source.requests,
              'hidden_sha256': hidden_row_sha,
              'logits_sha256': provenance['files']['expected-selected-logits.bf16.bin']['sha256'],
          }, sort_keys=True))
          PY

      - name: Commit bounded immutable fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Inkling evidence acquisition'
          git config user.email 'inkling@waste.invalid'
          git add tests/fixtures/inkling/final_head_primitive_real
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Freeze bounded Inkling final-head primitive fixture'
          git push origin HEAD:agent/inkling-final-head-primitive
