name: Diagnose Inkling BF16 router prefill lattice

on:
  pull_request:
    paths:
      - "experiments/inkling/diagnose_inkling_bf16_router_prefill_lattice.py"
      - "experiments/inkling/test_inkling_bf16_router_prefill_lattice.py"
      - "experiments/inkling/diagnose_inkling_bf16_router_weight_lattice.py"
      - "mvp/diagnose_inkling_native_bf16_backend.py"
      - "mvp/diagnose_inkling_pre_router.py"
      - "mvp/inkling_canonical_route_layer_parity.py"
      - "mvp/inkling_fixture_reference.py"
      - "mvp/inkling_remote_fixture.py"
      - "docs/OFFICIAL-ROUTER-SELECTION.json"
      - ".github/workflows/diagnose-inkling-bf16-router-prefill-lattice.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkling-router-prefill-lattice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router-prefill-lattice:
    name: Layer-2 router projection and normalization lattice
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and fingerprint the pinned official stack
        run: |
          python3 -m pip install --quiet --break-system-packages \
            'torch==2.13.0' 'transformers==5.14.1'
          python3 - <<'PY'
          import torch
          assert torch.__version__.split('+', 1)[0] == "2.13.0"
          print(
              "ROUTER_PREFILL_BACKEND "
              f"torch={torch.__version__} "
              f"dispatch={torch.backends.cpu.get_cpu_capability()} "
              f"threads={torch.get_num_threads()}"
          )
          PY

      - name: Run focused router-prefill contracts
        run: |
          python3 -m compileall -q experiments/inkling
          PYTHONPATH=mvp:experiments/inkling python3 -m unittest discover \
            -s experiments/inkling \
            -p 'test_inkling_bf16_router_prefill_lattice.py' -v

      - name: Reproduce the bounded router fixture plan
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          plan="${RUNNER_TEMP}/router-prefill-plan.json"
          python3 mvp/inkling_remote_fixture.py \
            --revision "$revision" \
            --layers 2 \
            --experts '2:150' \
            --max-total-gib 2 \
            --plan-only > "$plan"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          plan = json.loads((root / "router-prefill-plan.json").read_text())
          selection = json.loads(Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text())
          assert plan["experts"] == {"2": [150]}
          assert 0 < plan["entries"] < 64
          assert 0 < plan["payload_bytes"] < 2 * 1024**3
          assert plan["revision"] == selection["revision"]
          assert plan["config_sha256"] == selection["config_sha256"]
          assert plan["index_sha256"] == selection["index_sha256"]
          print(
              "ROUTER_PREFILL_PLAN "
              f"entries={plan['entries']} payload_bytes={plan['payload_bytes']} "
              f"requests={plan['requests']} experts={plan['experts']}"
          )
          PY

      - name: Extract and bind the bounded router fixture
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          fixture="${RUNNER_TEMP}/router-prefill-fixture"
          extracted=false
          for attempt in 1 2 3 4; do
            rm -rf "$fixture"
            if python3 mvp/inkling_remote_fixture.py \
              --revision "$revision" \
              --layers 2 \
              --experts '2:150' \
              --max-total-gib 2 \
              --out "$fixture" > "${RUNNER_TEMP}/router-prefill-manifest.json"; then
              extracted=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((10 << (attempt - 1)))
              echo "fixture attempt ${attempt} failed; retrying after ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$extracted" != true ]; then
            echo "router-prefill fixture extraction exhausted four attempts" >&2
            exit 2
          fi
          python3 inkling/tools/inkling_fixture.py --fixture "$fixture" --verify

          PYTHONPATH=mvp python3 - <<PY
          import json, time
          from pathlib import Path
          import torch
          from discover_inkling_router_experts import deterministic_hidden_states, input_sha256
          from inkling_remote_fixture import HttpRangeSource, RemoteFixtureError
          root = Path("${RUNNER_TEMP}")
          config = None
          for attempt in range(4):
              try:
                  source = HttpRangeSource(
                      "https://huggingface.co/thinkingmachines/Inkling-Small",
                      "$revision",
                  )
                  config = source.file("config.json")
                  break
              except RemoteFixtureError:
                  if attempt == 3:
                      raise
                  time.sleep(10 * (2**attempt))
          assert config is not None
          (root / "config.json").write_bytes(config)
          inputs = deterministic_hidden_states(8, 4096, 19)
          selection = json.loads(Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text())
          assert input_sha256(inputs, torch.bfloat16) == selection["inputs_sha256"]
          (root / "inputs.json").write_text(
              json.dumps(inputs.tolist()) + "\n", encoding="utf-8"
          )
          PY

      - name: Compare projection shapes and enumerate normalization policies
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=mvp:experiments/inkling python3 \
            experiments/inkling/diagnose_inkling_bf16_router_prefill_lattice.py \
            --fixture "${RUNNER_TEMP}/router-prefill-fixture" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --selection docs/OFFICIAL-ROUTER-SELECTION.json \
            --layers 2 \
            --dtype bfloat16 \
            --out "${RUNNER_TEMP}/router-prefill.json" > /dev/null

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "router-prefill.json").read_text())
          assert result["production_source_modified"] is False
          value = result["layers"]["2"]
          decision = value["decision"]
          # #35 position-zero fixed-ID normalization remains a hard regression anchor.
          assert value["positions"][0]["legacy_rowwise_weights"]["all"]["raw_exact_fraction"] == 1.0
          assert value["positions"][0]["legacy_batched_weights"]["all"]["raw_exact_fraction"] == 1.0
          print(
              "ROUTER_PREFILL_DECISION "
              f"classification={decision['classification']} "
              f"first_logit_shape={decision['first_selected_logit_mismatch_position']} "
              f"first_legacy_batched={decision['first_legacy_batched_weight_mismatch_position']} "
              f"first_legacy_rowwise={decision['first_legacy_rowwise_weight_mismatch_position']} "
              f"legacy_batched_all={decision['legacy_exact_on_all_batched_positions']} "
              f"legacy_rowwise_all={decision['legacy_exact_on_all_rowwise_positions']} "
              f"batched_common={decision['batched_exact_policy_intersection_count']} "
              f"rowwise_common={decision['rowwise_exact_policy_intersection_count']} "
              f"joint_common={decision['joint_exact_policy_intersection_count']} "
              f"preferred={decision['preferred_policy']}"
          )
          for item in value["positions"]:
              selected = item["selected_logits"]
              batched = item["legacy_batched_weights"]["all"]
              rowwise = item["legacy_rowwise_weights"]["all"]
              print(
                  "ROUTER_PREFILL_POSITION "
                  f"position={item['position']} "
                  f"selected_raw={selected['raw_exact_fraction']:.9f} "
                  f"selected_bf16={selected['bfloat16_exact_fraction']:.9f} "
                  f"selected_bf16max={selected['bfloat16_max_abs']:.9g} "
                  f"legacy_batched_raw={batched['raw_exact_fraction']:.9f} "
                  f"legacy_rowwise_raw={rowwise['raw_exact_fraction']:.9f} "
                  f"batched_exact_policies={item['batched_exact_policy_count']} "
                  f"rowwise_exact_policies={item['rowwise_exact_policy_count']}"
              )
          print(
              "ROUTER_PREFILL_JOINT "
              + json.dumps(value["joint_exact_policy_intersection"][:8], sort_keys=True)
          )
          PY
