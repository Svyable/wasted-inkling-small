name: Diagnose Inkling BF16 SiLU product

on:
  pull_request:
    paths:
      - "experiments/inkling/diagnose_inkling_bf16_silu_product.py"
      - "experiments/inkling/test_inkling_bf16_silu_product.py"
      - "mvp/diagnose_inkling_pre_router.py"
      - "mvp/inkling_canonical_route_layer_parity.py"
      - "mvp/inkling_fixture_reference.py"
      - "mvp/inkling_remote_fixture.py"
      - "docs/OFFICIAL-ROUTER-SELECTION.json"
      - ".github/workflows/diagnose-inkling-bf16-silu-product.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkling-bf16-silu-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  silu-product:
    name: BF16 SiLU and gate-product boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned official stack
        run: |
          python3 -m pip install --quiet --break-system-packages \
            torch 'transformers==5.14.1'

      - name: Run focused primitive contracts
        run: |
          python3 -m compileall -q experiments/inkling
          PYTHONPATH=mvp:experiments/inkling python3 -m unittest discover \
            -s experiments/inkling \
            -p 'test_inkling_bf16_silu_product.py' -v

      - name: Plan the first-selected-expert fixture
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          experts='2:150;5:56'
          plan="${RUNNER_TEMP}/silu-product-plan.json"
          python3 mvp/inkling_remote_fixture.py \
            --revision "$revision" \
            --layers 2,5 \
            --experts "$experts" \
            --max-total-gib 1 \
            --plan-only > "$plan"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          plan = json.loads((root / "silu-product-plan.json").read_text())
          selection = json.loads(
              Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text()
          )
          expected = {
              "2": [selection["layers"]["2"]["topk_indices"][0][0]],
              "5": [selection["layers"]["5"]["topk_indices"][0][0]],
          }
          assert plan["experts"] == expected, (plan["experts"], expected)
          assert plan["revision"] == selection["revision"]
          assert plan["config_sha256"] == selection["config_sha256"]
          assert plan["index_sha256"] == selection["index_sha256"]
          assert 0 < plan["payload_bytes"] < 1 << 30
          print(
              "SILU_PRODUCT_PLAN "
              f"entries={plan['entries']} "
              f"payload_bytes={plan['payload_bytes']} "
              f"metadata_bytes={plan['metadata_bytes_read']} "
              f"requests={plan['requests']} "
              f"shards={plan['shards']} "
              f"experts={plan['experts']}"
          )
          PY

      - name: Extract and bind the primitive fixture
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          fixture="${RUNNER_TEMP}/silu-product-fixture"
          extracted=false
          for attempt in 1 2 3 4; do
            rm -rf "$fixture"
            if python3 mvp/inkling_remote_fixture.py \
              --revision "$revision" \
              --layers 2,5 \
              --experts '2:150;5:56' \
              --max-total-gib 1 \
              --out "$fixture" > "${RUNNER_TEMP}/silu-product-manifest.json"; then
              extracted=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((10 << (attempt - 1)))
              echo "fixture attempt ${attempt} failed; retrying after ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$extracted" != true ]; then
            echo "primitive fixture extraction exhausted four attempts" >&2
            exit 2
          fi
          python3 inkling/tools/inkling_fixture.py \
            --fixture "$fixture" --verify

          PYTHONPATH=mvp python3 - <<PY
          import json
          import time
          from pathlib import Path
          import torch
          from discover_inkling_router_experts import (
              deterministic_hidden_states,
              input_sha256,
          )
          from inkling_remote_fixture import HttpRangeSource, RemoteFixtureError

          root = Path("${RUNNER_TEMP}")
          config = None
          for attempt in range(4):
              try:
                  source = HttpRangeSource(
                      "https://huggingface.co/thinkingmachines/Inkling-Small",
                      "$revision",
                  )
                  config = source.file("config.json")
                  break
              except RemoteFixtureError:
                  if attempt == 3:
                      raise
                  time.sleep(10 * (2**attempt))
          assert config is not None
          (root / "config.json").write_bytes(config)
          inputs = deterministic_hidden_states(8, 4096, 19)
          selection = json.loads(
              Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text()
          )
          assert input_sha256(inputs, torch.bfloat16) == selection["inputs_sha256"]
          (root / "inputs.json").write_text(
              json.dumps(inputs.tolist()) + "\n", encoding="utf-8"
          )
          PY

      - name: Classify SiLU and product completion points
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=mvp:experiments/inkling python3 \
            experiments/inkling/diagnose_inkling_bf16_silu_product.py \
            --fixture "${RUNNER_TEMP}/silu-product-fixture" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --selection docs/OFFICIAL-ROUTER-SELECTION.json \
            --layers 2,5 \
            --dtype bfloat16 \
            --out "${RUNNER_TEMP}/silu-product.json" > /dev/null

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "silu-product.json").read_text()
          )
          assert result["production_source_modified"] is False
          for layer, value in sorted(
              result["layers"].items(), key=lambda item: int(item[0])
          ):
              for path in ("routed", "shared"):
                  decision = value[path]["decision"]
                  print(
                      "SILU_PRODUCT_DECISION "
                      f"layer={layer} path={path} expert={value['expert']} "
                      f"classification={decision['classification']} "
                      f"policy={decision['sufficient_policy']}"
                  )
                  for name, metric in value[path]["variants"].items():
                      print(
                          "SILU_PRODUCT_VARIANT "
                          f"layer={layer} path={path} name={name} "
                          f"raw_exact={metric['raw_exact_fraction']:.9f} "
                          f"bf16_exact={metric['bfloat16_exact_fraction']:.9f} "
                          f"raw_max_abs={metric['raw_max_abs']:.9g} "
                          f"bf16_max_abs={metric['bfloat16_max_abs']:.9g}"
                      )
          PY
