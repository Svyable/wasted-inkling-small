name: Diagnose Inkling stateful BF16 MLP boundary

on:
  pull_request:
    paths:
      - "experiments/inkling/diagnose_inkling_bf16_stateful_mlp_boundary.py"
      - "experiments/inkling/test_inkling_bf16_stateful_mlp_boundary.py"
      - "experiments/inkling/diagnose_inkling_portable_bf16_stateful_sparse_layer.py"
      - "experiments/inkling/run_inkling_portable_bf16_complete_sparse_layer.py"
      - "experiments/inkling/run_inkling_portable_bf16_composed_moe.py"
      - "experiments/inkling/diagnose_inkling_portable_bf16_composed_moe.py"
      - "mvp/diagnose_inkling_pre_router.py"
      - "mvp/run_inkling_fixture_reference_canonical.py"
      - "mvp/inkling_canonical_route_layer_parity.py"
      - "mvp/inkling_fixture_reference.py"
      - "mvp/inkling_remote_fixture.py"
      - "mvp/inkling_c_config.py"
      - "inkling/src/inkling_attention.c"
      - "inkling/src/inkling_layer.c"
      - "inkling/src/inkling.c"
      - "docs/OFFICIAL-ROUTER-SELECTION.json"
      - ".github/workflows/diagnose-inkling-bf16-stateful-mlp-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkling-stateful-mlp-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stateful-mlp-boundary:
    name: Stateful layer-2 sparse MLP boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and fingerprint the pinned official stack
        run: |
          python3 -m pip install --quiet --break-system-packages \
            'torch==2.13.0' 'transformers==5.14.1'
          python3 - <<'PY'
          import torch
          assert torch.__version__.split('+', 1)[0] == "2.13.0"
          print(
              "STATEFUL_MLP_BACKEND "
              f"torch={torch.__version__} "
              f"dispatch={torch.backends.cpu.get_cpu_capability()} "
              f"threads={torch.get_num_threads()}"
          )
          PY

      - name: Run focused MLP-boundary contracts
        run: |
          python3 -m compileall -q experiments/inkling
          PYTHONPATH=mvp:experiments/inkling python3 -m unittest discover \
            -s experiments/inkling \
            -p 'test_inkling_bf16_stateful_mlp_boundary.py' -v

      - name: Reproduce the layer-2 eight-token fixture plan
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          experts='2:13,19,25,26,27,30,33,39,60,67,69,81,90,91,92,95,96,112,116,117,126,131,133,140,146,150,152,166,175,217,238,247,254'
          plan="${RUNNER_TEMP}/stateful-mlp-plan.json"
          python3 mvp/inkling_remote_fixture.py \
            --revision "$revision" \
            --layers 2 \
            --experts "$experts" \
            --max-total-gib 3 \
            --plan-only > "$plan"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          plan = json.loads((root / "stateful-mlp-plan.json").read_text())
          selection = json.loads(Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text())
          expected = sorted({
              expert
              for row in selection["layers"]["2"]["topk_indices"]
              for expert in row
          })
          assert sorted(plan["experts"]["2"]) == expected
          assert len(expected) == 33
          assert 0 < plan["entries"] < 158
          assert plan["payload_bytes"] < 3 * 1024**3
          assert plan["revision"] == selection["revision"]
          assert plan["config_sha256"] == selection["config_sha256"]
          assert plan["index_sha256"] == selection["index_sha256"]
          print(
              "STATEFUL_MLP_PLAN "
              f"entries={plan['entries']} payload_bytes={plan['payload_bytes']} "
              f"requests={plan['requests']} experts={len(expected)}"
          )
          PY

      - name: Extract and bind the layer-2 fixture
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          experts='2:13,19,25,26,27,30,33,39,60,67,69,81,90,91,92,95,96,112,116,117,126,131,133,140,146,150,152,166,175,217,238,247,254'
          fixture="${RUNNER_TEMP}/stateful-mlp-fixture"
          extracted=false
          for attempt in 1 2 3 4; do
            rm -rf "$fixture"
            if python3 mvp/inkling_remote_fixture.py \
              --revision "$revision" \
              --layers 2 \
              --experts "$experts" \
              --max-total-gib 3 \
              --out "$fixture" > "${RUNNER_TEMP}/stateful-mlp-manifest.json"; then
              extracted=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((10 << (attempt - 1)))
              echo "fixture attempt ${attempt} failed; retrying after ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$extracted" != true ]; then
            echo "stateful MLP fixture extraction exhausted four attempts" >&2
            exit 2
          fi
          python3 inkling/tools/inkling_fixture.py --fixture "$fixture" --verify

          PYTHONPATH=mvp python3 - <<PY
          import json, time
          from pathlib import Path
          import torch
          from discover_inkling_router_experts import deterministic_hidden_states, input_sha256
          from inkling_remote_fixture import HttpRangeSource, RemoteFixtureError
          root = Path("${RUNNER_TEMP}")
          config = None
          for attempt in range(4):
              try:
                  source = HttpRangeSource("https://huggingface.co/thinkingmachines/Inkling-Small", "$revision")
                  config = source.file("config.json")
                  break
              except RemoteFixtureError:
                  if attempt == 3:
                      raise
                  time.sleep(10 * (2**attempt))
          assert config is not None
          (root / "config.json").write_bytes(config)
          inputs = deterministic_hidden_states(8, 4096, 19)
          selection = json.loads(Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text())
          assert input_sha256(inputs, torch.bfloat16) == selection["inputs_sha256"]
          (root / "inputs.json").write_text(json.dumps(inputs.tolist()) + "\n", encoding="utf-8")
          PY

          PYTHONPATH=mvp python3 mvp/inkling_c_config.py \
            --model-config "${RUNNER_TEMP}/config.json" \
            --out "${RUNNER_TEMP}/c-config.json"

      - name: Classify the stateful sparse-MLP ladder
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=mvp:experiments/inkling python3 \
            experiments/inkling/diagnose_inkling_bf16_stateful_mlp_boundary.py \
            --fixture "${RUNNER_TEMP}/stateful-mlp-fixture" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --c-config "${RUNNER_TEMP}/c-config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --selection docs/OFFICIAL-ROUTER-SELECTION.json \
            --layers 2 \
            --dtype bfloat16 \
            --out "${RUNNER_TEMP}/stateful-mlp.json" > /dev/null

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "stateful-mlp.json").read_text())
          assert result["source"]["production_source_unchanged"] is True
          value = result["layers"]["2"]
          decision = value["decision"]
          # #44/#45 regression anchors at position zero.
          assert value["stages"]["routed_weight"][0]["raw_exact_fraction"] == 1.0
          assert value["stages"]["shared_weight"][0]["raw_exact_fraction"] == 1.0
          assert value["stages"]["moe_out"][0]["raw_exact_fraction"] == 1.0
          assert value["stages"]["mlp_branch"][0]["bfloat16_exact_fraction"] == 1.0
          assert value["stages"]["layer_out"][0]["raw_exact_fraction"] == 1.0
          print(
              "STATEFUL_MLP_DECISION "
              f"classification={decision['classification']} "
              f"stage={decision['first_boundary_stage']} "
              f"position={decision['first_boundary_position']} "
              f"firsts={decision['first_nonexact_positions']} "
              f"backend_calls={len(value['backend_calls'])}"
          )
          for position in range(8):
              parts = [f"position={position}"]
              for stage in ("routed_weight", "shared_weight", "moe_out", "mlp_branch", "layer_out"):
                  metric = value["stages"][stage][position]
                  parts.append(f"{stage}_raw={metric['raw_exact_fraction']:.9f}")
                  parts.append(f"{stage}_bf16={metric['bfloat16_exact_fraction']:.9f}")
                  parts.append(f"{stage}_bf16max={metric['bfloat16_max_abs']:.9g}")
              print("STATEFUL_MLP_POSITION " + " ".join(parts))
          PY
