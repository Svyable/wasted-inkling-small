name: Diagnose Inkling native BF16 backend

on:
  pull_request:
    paths:
      - "mvp/diagnose_inkling_native_bf16_backend.py"
      - "mvp/test_inkling_native_bf16_backend.py"
      - "mvp/diagnose_inkling_bf16_projection_granularity.py"
      - "mvp/diagnose_inkling_pre_router.py"
      - "mvp/discover_inkling_c_router_experts.py"
      - "mvp/discover_inkling_router_experts.py"
      - "mvp/inkling_compact_layer_parity.py"
      - "mvp/inkling_c_config.py"
      - "mvp/inkling_remote_fixture.py"
      - "inkling/src/inkling_layer.c"
      - "inkling/src/inkling_layer.h"
      - "docs/OFFICIAL-ROUTER-SELECTION.json"
      - ".github/workflows/diagnose-inkling-native-bf16-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkling-native-bf16-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Native BF16 matrices and exact projection oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned official stack
        run: |
          python3 -m pip install --quiet --break-system-packages \
            torch 'transformers==5.14.1'

      - name: Extract and bind the one-expert seed
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          fixture="${RUNNER_TEMP}/router-seed"
          python3 mvp/inkling_remote_fixture.py \
            --revision "$revision" \
            --layers 2,5 \
            --experts '2:0;5:0' \
            --max-total-gib 4 \
            --out "$fixture" > "${RUNNER_TEMP}/seed-manifest.json"
          PYTHONPATH=mvp python3 - <<PY
          import json
          from pathlib import Path
          import torch
          from discover_inkling_router_experts import (
              deterministic_hidden_states,
              input_sha256,
          )
          from inkling_remote_fixture import HttpRangeSource

          root = Path("${RUNNER_TEMP}")
          source = HttpRangeSource(
              "https://huggingface.co/thinkingmachines/Inkling-Small",
              "$revision",
          )
          (root / "config.json").write_bytes(source.file("config.json"))
          inputs = deterministic_hidden_states(8, 4096, 19)
          selection = json.loads(
              Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text()
          )
          assert input_sha256(inputs, torch.bfloat16) == selection["inputs_sha256"]
          (root / "inputs.json").write_text(
              json.dumps(inputs.tolist()) + "\n", encoding="utf-8"
          )
          PY
          PYTHONPATH=mvp python3 mvp/inkling_c_config.py \
            --model-config "${RUNNER_TEMP}/config.json" \
            --out "${RUNNER_TEMP}/c-config.json"

      - name: Run native BF16 backend and exact projection variants
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=mvp python3 mvp/diagnose_inkling_native_bf16_backend.py \
            --fixture "${RUNNER_TEMP}/router-seed" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --c-config "${RUNNER_TEMP}/c-config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --layers 2,5 \
            --dtype bfloat16 \
            --out "${RUNNER_TEMP}/native-bf16-backend.json" > /dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "native-bf16-backend.json").read_text()
          )
          assert result["source"]["production_source_unchanged"] is True
          for layer, layer_value in sorted(
              result["layers"].items(), key=lambda item: int(item[0])
          ):
              for variant, value in layer_value["variants"].items():
                  print(
                      "NATIVE_BF16_BACKEND "
                      f"layer={layer} variant={variant} "
                      f"exact_prefix={value['exact_bfloat16_prefix']} "
                      f"next_stage={value['next_stage_after_exact_prefix']} "
                      f"backend_calls={len(value['backend_calls'])}"
                  )
                  for point in (
                      "input_norm",
                      "q_proj",
                      "k_proj",
                      "v_proj",
                      "relative_proj_input",
                      "k_sconv",
                      "v_sconv",
                      "attention_out",
                      "attention_branch",
                      "post_attention_residual",
                      "post_attention_norm",
                  ):
                      metrics = value["stage_comparison"]["stages"][point]
                      if (
                          metrics["quantized_exact_fraction"] < 1.0
                          or point == value["next_stage_after_exact_prefix"]
                      ):
                          print(
                              "NATIVE_BF16_BACKEND_STAGE "
                              f"layer={layer} variant={variant} point={point} "
                              f"exact={metrics['quantized_exact_fraction']:.9f} "
                              f"max_abs={metrics['max_abs']:.9g} "
                              f"mean_abs={metrics['mean_abs']:.9g}"
                          )
                  for point, kernel in value["projection_kernel"].items():
                      print(
                          "NATIVE_BF16_BACKEND_PROJECTION "
                          f"layer={layer} variant={variant} point={point} "
                          f"classification={kernel['classification']} "
                          f"prefill_positions={kernel['candidate_vs_prefill_mismatch_positions']} "
                          f"token_positions={kernel['candidate_vs_token_step_mismatch_positions']}"
                      )
          PY
