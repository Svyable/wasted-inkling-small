name: Diagnose Inkling portable BF16 attention

on:
  pull_request:
    paths:
      - "experiments/inkling/diagnose_inkling_portable_bf16_attention.py"
      - "experiments/inkling/test_inkling_portable_bf16_attention.py"
      - "mvp/diagnose_inkling_bf16_attention_reductions.py"
      - "mvp/diagnose_inkling_native_bf16_backend.py"
      - "mvp/diagnose_inkling_pre_router.py"
      - "mvp/inkling_remote_fixture.py"
      - "inkling/src/inkling_attention.c"
      - "inkling/src/inkling_layer.c"
      - "docs/OFFICIAL-ROUTER-SELECTION.json"
      - ".github/workflows/diagnose-inkling-portable-bf16-attention.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkling-portable-bf16-attention-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-attention:
    name: Portable BF16 attention candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned official stack
        run: |
          python3 -m pip install --quiet --break-system-packages \
            torch 'transformers==5.14.1'

      - name: Run focused source and compile contracts
        run: |
          python3 -m compileall -q experiments/inkling
          PYTHONPATH=mvp:experiments/inkling python3 -m unittest discover \
            -s experiments/inkling \
            -p 'test_inkling_portable_bf16_attention.py' -v

      - name: Extract and bind the one-expert seed
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          fixture="${RUNNER_TEMP}/router-seed"
          manifest="${RUNNER_TEMP}/seed-manifest.json"
          extracted=false
          for attempt in 1 2 3 4; do
            rm -rf "$fixture"
            rm -f "$manifest"
            if python3 mvp/inkling_remote_fixture.py \
              --revision "$revision" \
              --layers 2,5 \
              --experts '2:0;5:0' \
              --max-total-gib 4 \
              --out "$fixture" > "$manifest"; then
              extracted=true
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              break
            fi
            delay=$((10 << (attempt - 1)))
            echo "seed attempt ${attempt} failed; retrying after ${delay}s" >&2
            sleep "$delay"
          done
          if [ "$extracted" != true ]; then
            echo "seed acquisition exhausted four bounded attempts" >&2
            exit 2
          fi

          PYTHONPATH=mvp python3 - <<PY
          import json
          import time
          from pathlib import Path
          import torch
          from discover_inkling_router_experts import (
              deterministic_hidden_states,
              input_sha256,
          )
          from inkling_remote_fixture import HttpRangeSource, RemoteFixtureError

          root = Path("${RUNNER_TEMP}")
          config = None
          for attempt in range(4):
              try:
                  source = HttpRangeSource(
                      "https://huggingface.co/thinkingmachines/Inkling-Small",
                      "$revision",
                  )
                  config = source.file("config.json")
                  break
              except RemoteFixtureError:
                  if attempt == 3:
                      raise
                  time.sleep(10 * (2**attempt))
          assert config is not None
          (root / "config.json").write_bytes(config)
          inputs = deterministic_hidden_states(8, 4096, 19)
          selection = json.loads(
              Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text()
          )
          assert input_sha256(inputs, torch.bfloat16) == selection["inputs_sha256"]
          (root / "inputs.json").write_text(
              json.dumps(inputs.tolist()) + "\n", encoding="utf-8"
          )
          PY

          PYTHONPATH=mvp python3 mvp/inkling_c_config.py \
            --model-config "${RUNNER_TEMP}/config.json" \
            --out "${RUNNER_TEMP}/c-config.json"

      - name: Run the complete portable attention policy
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=mvp:experiments/inkling python3 \
            experiments/inkling/diagnose_inkling_portable_bf16_attention.py \
            --fixture "${RUNNER_TEMP}/router-seed" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --c-config "${RUNNER_TEMP}/c-config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --layers 2,5 \
            --dtype bfloat16 \
            --out "${RUNNER_TEMP}/portable-attention.json" > /dev/null

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "portable-attention.json").read_text()
          )
          assert result["source"]["production_source_unchanged"] is True
          for layer, value in sorted(
              result["layers"].items(), key=lambda item: int(item[0])
          ):
              print(
                  "PORTABLE_BF16_ATTENTION "
                  f"layer={layer} exact_prefix={value['exact_bfloat16_prefix']} "
                  f"next_stage={value['next_stage_after_exact_prefix']} "
                  f"backend_calls={len(value['backend_calls'])}"
              )
              for point, metrics in value["stages"].items():
                  if (
                      metrics["quantized_exact_fraction"] < 1.0
                      or point == value["next_stage_after_exact_prefix"]
                  ):
                      print(
                          "PORTABLE_BF16_ATTENTION_STAGE "
                          f"layer={layer} point={point} "
                          f"exact={metrics['quantized_exact_fraction']:.9f} "
                          f"max_abs={metrics['max_abs']:.9g} "
                          f"mean_abs={metrics['mean_abs']:.9g}"
                      )
          print(
              "PORTABLE_BF16_ATTENTION_SCOPE "
              f"log_scaling_exercised={result['log_scaling_exercised']}"
          )
          PY
