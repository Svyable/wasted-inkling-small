name: Diagnose Inkling pre-router BF16

on:
  pull_request:
    paths:
      - "mvp/diagnose_inkling_pre_router.py"
      - "mvp/diagnose_inkling_stage_injection.py"
      - "mvp/diagnose_inkling_bf16_primitives.py"
      - "mvp/test_inkling_pre_router_diagnosis.py"
      - "mvp/test_inkling_bf16_primitives.py"
      - "mvp/analyze_inkling_router_mismatch.py"
      - "mvp/discover_inkling_c_router_experts.py"
      - "mvp/discover_inkling_router_experts.py"
      - "mvp/inkling_c_config.py"
      - "mvp/inkling_compact_layer_parity.py"
      - "docs/OFFICIAL-ROUTER-SELECTION.json"
      - ".github/workflows/diagnose-inkling-pre-router.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkling-pre-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Official-vs-C pre-router stages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned official stack
        run: |
          python3 -m pip install --quiet --break-system-packages \
            torch 'transformers==5.14.1'

      - name: Extract the one-expert diagnostic seed
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          fixture="${RUNNER_TEMP}/router-seed"
          python3 mvp/inkling_remote_fixture.py \
            --revision "$revision" \
            --layers 2,5 \
            --experts '2:0;5:0' \
            --max-total-gib 4 \
            --out "$fixture" > "${RUNNER_TEMP}/seed-manifest.json"
          PYTHONPATH=mvp python3 - <<PY
          import json
          from pathlib import Path
          import torch
          from discover_inkling_router_experts import (
              deterministic_hidden_states,
              input_sha256,
          )
          from inkling_remote_fixture import HttpRangeSource

          root = Path("${RUNNER_TEMP}")
          source = HttpRangeSource(
              "https://huggingface.co/thinkingmachines/Inkling-Small",
              "$revision",
          )
          (root / "config.json").write_bytes(source.file("config.json"))
          inputs = deterministic_hidden_states(8, 4096, 19)
          selection = json.loads(
              Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text()
          )
          assert input_sha256(inputs, torch.bfloat16) == selection["inputs_sha256"]
          (root / "inputs.json").write_text(
              json.dumps(inputs.tolist()) + "\n", encoding="utf-8"
          )
          PY
          PYTHONPATH=mvp python3 mvp/inkling_c_config.py \
            --model-config "${RUNNER_TEMP}/config.json" \
            --out "${RUNNER_TEMP}/c-config.json"

      - name: Locate and test BF16 drift before routing
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=mvp python3 mvp/diagnose_inkling_pre_router.py \
            --fixture "${RUNNER_TEMP}/router-seed" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --c-config "${RUNNER_TEMP}/c-config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --layers 2,5 \
            --dtype bfloat16 \
            --out "${RUNNER_TEMP}/pre-router-analysis.json" > /dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          analysis = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "pre-router-analysis.json").read_text()
          )
          for layer, value in sorted(
              analysis["layers"].items(), key=lambda item: int(item[0])
          ):
              counter = value["counterfactuals"]["requantize_all_traced_stages"]
              print(
                  "PRE_ROUTER_DIAG "
                  f"layer={layer} "
                  f"baseline_first={value['first_nonexact_bfloat16_stage']} "
                  f"requantized_first={counter['first_nonexact_bfloat16_stage']} "
                  f"requantized_all_exact={counter['all_stages_bfloat16_exact']}"
              )
              for point in value["stages"]:
                  baseline = value["stages"][point]
                  requantized = counter["stages"][point]
                  print(
                      "PRE_ROUTER_STAGE "
                      f"layer={layer} point={point} "
                      f"baseline_exact={baseline['quantized_exact_fraction']:.9f} "
                      f"requantized_exact={requantized['quantized_exact_fraction']:.9f} "
                      f"baseline_max={baseline['max_abs']:.9g} "
                      f"requantized_max={requantized['max_abs']:.9g}"
                  )
              for name, route in value["routing"].items():
                  print(
                      "PRE_ROUTER_ROUTE "
                      f"layer={layer} variant={name} "
                      f"exact_rows={route['exact_rows']}/{route['total_rows']} "
                      f"max_abs_weight={route['max_abs_weight_on_exact_rows']:.9g}"
                  )
          PY

      - name: Sweep grouped official stage counterfactuals
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=mvp python3 mvp/diagnose_inkling_stage_injection.py \
            --fixture "${RUNNER_TEMP}/router-seed" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --c-config "${RUNNER_TEMP}/c-config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --layers 2,5 \
            --dtype bfloat16 \
            --out "${RUNNER_TEMP}/stage-counterfactuals.json" > /dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          diagnosis = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "stage-counterfactuals.json").read_text()
          )
          cumulative_order = list(diagnosis["cumulative_injection_cases"])
          for layer, value in sorted(
              diagnosis["layers"].items(), key=lambda item: int(item[0])
          ):
              for case_name, case in value["cases"].items():
                  post = case["post_attention_norm"]
                  emitted = case["c_emitted"]
                  official = case["official_bfloat16_router"]
                  print(
                      "STAGE_INJECTION "
                      f"layer={layer} case={case_name} "
                      f"points={case['points']} "
                      f"post_norm_exact={post['quantized_exact_fraction']:.9f} "
                      f"post_norm_max={post['max_abs']:.9g} "
                      f"c_rows={emitted['exact_rows']}/{emitted['total_rows']} "
                      f"official_router_rows={official['exact_rows']}/{official['total_rows']}"
                  )
              first_raw_exact_route = None
              for case_name in cumulative_order:
                  case = value["cumulative_cases"][case_name]
                  post = case["post_attention_norm"]
                  emitted = case["c_emitted"]
                  official = case["official_bfloat16_router"]
                  if (
                      first_raw_exact_route is None
                      and official["exact_rows"] == official["total_rows"]
                  ):
                      first_raw_exact_route = case_name
                  print(
                      "STAGE_CUMULATIVE "
                      f"layer={layer} case={case_name} "
                      f"last_point={case['points'][-1]} "
                      f"post_norm_exact={post['quantized_exact_fraction']:.9f} "
                      f"post_norm_max={post['max_abs']:.9g} "
                      f"c_rows={emitted['exact_rows']}/{emitted['total_rows']} "
                      f"official_router_rows={official['exact_rows']}/{official['total_rows']}"
                  )
              print(
                  "STAGE_CUMULATIVE_FIRST_RAW_EXACT_ROUTE "
                  f"layer={layer} case={first_raw_exact_route} "
                  "note=cutoff-tie-sensitive-not-a-correctness-gate"
              )
              for case_name, case in value["quantization_cases"].items():
                  post = case["post_attention_norm"]
                  emitted = case["c_emitted"]
                  official = case["official_bfloat16_router"]
                  print(
                      "STAGE_QUANTIZATION "
                      f"layer={layer} case={case_name} "
                      f"points={case['points']} "
                      f"post_norm_exact={post['quantized_exact_fraction']:.9f} "
                      f"post_norm_max={post['max_abs']:.9g} "
                      f"c_rows={emitted['exact_rows']}/{emitted['total_rows']} "
                      f"official_router_rows={official['exact_rows']}/{official['total_rows']}"
                  )
          PY

      - name: Compare RMSNorm and linear primitive semantics
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=mvp python3 mvp/diagnose_inkling_bf16_primitives.py \
            --fixture "${RUNNER_TEMP}/router-seed" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --c-config "${RUNNER_TEMP}/c-config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --layers 2,5 \
            --dtype bfloat16 \
            --out "${RUNNER_TEMP}/bf16-primitives.json" > /dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "bf16-primitives.json").read_text()
          )
          for layer, value in sorted(
              result["layers"].items(), key=lambda item: int(item[0])
          ):
              print(
                  "BF16_PRIMITIVE "
                  f"layer={layer} "
                  f"rmsnorm={value['rmsnorm_classification']} "
                  f"linear={value['linear_classification']}"
              )
              for group_name, group in (
                  ("rmsnorm", value["rmsnorm"]),
                  ("q_projection", value["q_projection"]),
              ):
                  for variant, metrics in group.items():
                      if variant == "sampled_rows":
                          continue
                      print(
                          "BF16_PRIMITIVE_VARIANT "
                          f"layer={layer} group={group_name} variant={variant} "
                          f"exact={metrics['quantized_exact_fraction']:.9f} "
                          f"max_abs={metrics['max_abs']:.9g} "
                          f"mean_abs={metrics['mean_abs']:.9g}"
                      )
          PY
