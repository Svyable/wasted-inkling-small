name: Evidence Inkling complete BF16 sparse layer

on:
  pull_request:
    paths:
      - "experiments/inkling/run_inkling_portable_bf16_complete_sparse_layer.py"
      - "experiments/inkling/test_inkling_portable_bf16_complete_sparse_layer.py"
      - "experiments/inkling/run_inkling_portable_bf16_composed_moe.py"
      - "experiments/inkling/diagnose_inkling_portable_bf16_composed_moe.py"
      - "experiments/inkling/diagnose_inkling_bf16_router_weight_lattice.py"
      - "experiments/inkling/diagnose_inkling_portable_bf16_single_token_moe_activation.py"
      - "experiments/inkling/diagnose_inkling_portable_bf16_single_token_moe.py"
      - "mvp/diagnose_inkling_pre_router.py"
      - "mvp/inkling_canonical_route_layer_parity.py"
      - "mvp/run_inkling_fixture_reference_canonical.py"
      - "mvp/inkling_fixture_reference.py"
      - "mvp/inkling_remote_fixture.py"
      - "mvp/inkling_c_config.py"
      - "inkling/src/inkling_attention.c"
      - "inkling/src/inkling_layer.c"
      - "docs/OFFICIAL-ROUTER-SELECTION.json"
      - ".github/workflows/evidence-inkling-bf16-complete-sparse-layer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkling-bf16-complete-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-sparse-layer:
    name: Complete BF16 sparse layer token
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and fingerprint the pinned official stack
        run: |
          python3 -m pip install --quiet --break-system-packages \
            'torch==2.13.0' 'transformers==5.14.1'
          python3 - <<'PY'
          import torch
          assert torch.__version__.split('+', 1)[0] == "2.13.0"
          print(
              "COMPLETE_SPARSE_BACKEND "
              f"torch={torch.__version__} "
              f"dispatch={torch.backends.cpu.get_cpu_capability()} "
              f"threads={torch.get_num_threads()}"
          )
          PY

      - name: Run focused final-residual contracts
        run: |
          python3 -m compileall -q experiments/inkling
          PYTHONPATH=mvp:experiments/inkling python3 -m unittest discover \
            -s experiments/inkling \
            -p 'test_inkling_portable_bf16_complete_sparse_layer.py' -v

      - name: Reproduce the exact position-zero fixture plan
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          plan="${RUNNER_TEMP}/complete-sparse-plan.json"
          python3 mvp/inkling_remote_fixture.py \
            --revision "$revision" \
            --layers 2,5 \
            --experts '2:13,67,69,90,150,238;5:56,63,66,105,180,238' \
            --max-total-gib 2 \
            --plan-only > "$plan"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          plan = json.loads((root / "complete-sparse-plan.json").read_text())
          selection = json.loads(Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text())
          expected = {
              "2": sorted(selection["layers"]["2"]["topk_indices"][0]),
              "5": sorted(selection["layers"]["5"]["topk_indices"][0]),
          }
          actual = {layer: sorted(values) for layer, values in plan["experts"].items()}
          assert actual == expected
          assert plan["entries"] == 64
          assert plan["payload_bytes"] == 985959432
          assert plan["revision"] == selection["revision"]
          assert plan["config_sha256"] == selection["config_sha256"]
          assert plan["index_sha256"] == selection["index_sha256"]
          print(f"COMPLETE_SPARSE_PLAN entries={plan['entries']} payload_bytes={plan['payload_bytes']} requests={plan['requests']} experts={actual}")
          PY

      - name: Extract and bind the source-bound fixture
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          fixture="${RUNNER_TEMP}/complete-sparse-fixture"
          extracted=false
          for attempt in 1 2 3 4; do
            rm -rf "$fixture"
            if python3 mvp/inkling_remote_fixture.py \
              --revision "$revision" \
              --layers 2,5 \
              --experts '2:13,67,69,90,150,238;5:56,63,66,105,180,238' \
              --max-total-gib 2 \
              --out "$fixture" > "${RUNNER_TEMP}/complete-sparse-manifest.json"; then
              extracted=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((10 << (attempt - 1)))
              echo "fixture attempt ${attempt} failed; retrying after ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$extracted" != true ]; then
            echo "complete sparse fixture extraction exhausted four attempts" >&2
            exit 2
          fi
          python3 inkling/tools/inkling_fixture.py --fixture "$fixture" --verify

          PYTHONPATH=mvp python3 - <<PY
          import json, time
          from pathlib import Path
          import torch
          from discover_inkling_router_experts import deterministic_hidden_states, input_sha256
          from inkling_remote_fixture import HttpRangeSource, RemoteFixtureError
          root = Path("${RUNNER_TEMP}")
          config = None
          for attempt in range(4):
              try:
                  source = HttpRangeSource("https://huggingface.co/thinkingmachines/Inkling-Small", "$revision")
                  config = source.file("config.json")
                  break
              except RemoteFixtureError:
                  if attempt == 3:
                      raise
                  time.sleep(10 * (2**attempt))
          assert config is not None
          (root / "config.json").write_bytes(config)
          inputs = deterministic_hidden_states(8, 4096, 19)
          selection = json.loads(Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text())
          assert input_sha256(inputs, torch.bfloat16) == selection["inputs_sha256"]
          (root / "inputs.json").write_text(json.dumps(inputs.tolist()) + "\n", encoding="utf-8")
          PY

          PYTHONPATH=mvp python3 mvp/inkling_c_config.py \
            --model-config "${RUNNER_TEMP}/config.json" \
            --out "${RUNNER_TEMP}/c-config.json"

      - name: Execute the complete sparse layer token
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=mvp:experiments/inkling python3 \
            experiments/inkling/run_inkling_portable_bf16_complete_sparse_layer.py \
            --fixture "${RUNNER_TEMP}/complete-sparse-fixture" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --c-config "${RUNNER_TEMP}/c-config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --selection docs/OFFICIAL-ROUTER-SELECTION.json \
            --layers 2,5 \
            --dtype bfloat16 \
            --out "${RUNNER_TEMP}/complete-sparse.json" > /dev/null

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "complete-sparse.json").read_text())
          assert result["source"]["production_source_unchanged"] is True
          for layer, value in sorted(result["layers"].items(), key=lambda item: int(item[0])):
              decision = value["decision"]
              layer_out = value["stages"]["layer_out"]
              assert decision["classification"] == "single_token_sparse_layer_is_bfloat16_exact"
              assert decision["first_nonexact_stage"] is None
              assert layer_out["raw_exact_fraction"] == 1.0
              assert layer_out["bfloat16_exact_fraction"] == 1.0
              print(
                  "COMPLETE_SPARSE_DECISION "
                  f"layer={layer} classification={decision['classification']} "
                  f"prefix={decision['exact_bfloat16_prefix']} "
                  f"layer_out_raw_exact={layer_out['raw_exact_fraction']:.9f} "
                  f"layer_out_bf16_exact={layer_out['bfloat16_exact_fraction']:.9f}"
              )
          PY
