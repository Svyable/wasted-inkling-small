name: Evidence Inkling BF16 router denominator

on:
  pull_request:
    paths:
      - "experiments/inkling/diagnose_inkling_bf16_router_post_reduction_denom.py"
      - "experiments/inkling/test_inkling_bf16_router_post_reduction_denom.py"
      - "mvp/diagnose_inkling_pre_router.py"
      - "mvp/inkling_canonical_route_layer_parity.py"
      - "mvp/inkling_fixture_reference.py"
      - "mvp/inkling_remote_fixture.py"
      - "docs/OFFICIAL-ROUTER-SELECTION.json"
      - ".github/workflows/evidence-inkling-bf16-router-denominator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkling-bf16-router-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-reduction-denom:
    name: Layer-2 post-reduction router denominator
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and fingerprint the pinned official stack
        run: |
          python3 -m pip install --quiet --break-system-packages \
            'torch==2.13.0' 'transformers==5.14.1'
          python3 - <<'PY'
          import torch
          assert torch.__version__.split('+', 1)[0] == "2.13.0"
          print(
              "POST_REDUCTION_BACKEND "
              f"torch={torch.__version__} "
              f"dispatch={torch.backends.cpu.get_cpu_capability()} "
              f"threads={torch.get_num_threads()}"
          )
          PY

      - name: Run focused post-reduction contracts
        run: |
          python3 -m compileall -q experiments/inkling
          PYTHONPATH=mvp:experiments/inkling python3 -m unittest discover \
            -s experiments/inkling \
            -p 'test_inkling_bf16_router_post_reduction_denom.py' -v

      - name: Reproduce the exact router fixture plan
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          plan="${RUNNER_TEMP}/post-reduction-plan.json"
          planned=false
          for attempt in 1 2 3 4; do
            rm -f "$plan"
            if timeout 90s python3 mvp/inkling_remote_fixture.py \
              --revision "$revision" \
              --layers 2 \
              --experts '2:150' \
              --max-total-gib 1 \
              --plan-only > "$plan"; then
              planned=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((5 << (attempt - 1)))
              echo "router plan attempt ${attempt} failed or timed out; retrying after ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$planned" != true ]; then
            echo "router plan exhausted four bounded attempts" >&2
            exit 2
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          plan = json.loads((root / "post-reduction-plan.json").read_text())
          selection = json.loads(Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text())
          assert plan["experts"] == {"2": [150]}
          assert plan["entries"] == 23
          assert plan["payload_bytes"] == 241321476
          assert plan["requests"] == 26
          assert plan["revision"] == selection["revision"]
          assert plan["config_sha256"] == selection["config_sha256"]
          assert plan["index_sha256"] == selection["index_sha256"]
          print(
              "POST_REDUCTION_PLAN "
              f"entries={plan['entries']} payload_bytes={plan['payload_bytes']} "
              f"requests={plan['requests']} experts={plan['experts']}"
          )
          PY

      - name: Extract and bind the exact router fixture
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          fixture="${RUNNER_TEMP}/post-reduction-fixture"
          extracted=false
          for attempt in 1 2 3 4; do
            rm -rf "$fixture"
            if python3 mvp/inkling_remote_fixture.py \
              --revision "$revision" \
              --layers 2 \
              --experts '2:150' \
              --max-total-gib 1 \
              --out "$fixture" > "${RUNNER_TEMP}/post-reduction-manifest.json"; then
              extracted=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((10 << (attempt - 1)))
              echo "fixture attempt ${attempt} failed; retrying after ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$extracted" != true ]; then
            echo "post-reduction fixture extraction exhausted four attempts" >&2
            exit 2
          fi
          python3 inkling/tools/inkling_fixture.py --fixture "$fixture" --verify

          PYTHONPATH=mvp python3 - <<PY
          import json, time
          from pathlib import Path
          import torch
          from discover_inkling_router_experts import deterministic_hidden_states, input_sha256
          from inkling_remote_fixture import HttpRangeSource, RemoteFixtureError
          root = Path("${RUNNER_TEMP}")
          config = None
          for attempt in range(4):
              try:
                  source = HttpRangeSource(
                      "https://huggingface.co/thinkingmachines/Inkling-Small",
                      "$revision",
                  )
                  config = source.file("config.json")
                  break
              except RemoteFixtureError:
                  if attempt == 3:
                      raise
                  time.sleep(10 * (2**attempt))
          assert config is not None
          (root / "config.json").write_bytes(config)
          inputs = deterministic_hidden_states(8, 4096, 19)
          selection = json.loads(Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text())
          assert input_sha256(inputs, torch.bfloat16) == selection["inputs_sha256"]
          (root / "inputs.json").write_text(
              json.dumps(inputs.tolist()) + "\n", encoding="utf-8"
          )
          PY

      - name: Verify complete eight-position routed and shared weights
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=mvp:experiments/inkling python3 \
            experiments/inkling/diagnose_inkling_bf16_router_post_reduction_denom.py \
            --fixture "${RUNNER_TEMP}/post-reduction-fixture" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --selection docs/OFFICIAL-ROUTER-SELECTION.json \
            --layers 2 \
            --dtype bfloat16 \
            --out "${RUNNER_TEMP}/post-reduction.json" > /dev/null

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "post-reduction.json").read_text())
          assert result["production_source_modified"] is False
          value = result["layers"]["2"]
          decision = value["decision"]
          for item in value["positions"]:
              assert item["torch_final_anchor"]["raw_exact_fraction"] == 1.0
              assert item["denom_anchor"]["raw_exact_fraction"] == 1.0
          print(
              "POST_REDUCTION_DECISION "
              f"classification={decision['classification']} "
              f"failure_position={decision['first_failure_position']} "
              f"preferred={json.dumps(decision['preferred_policy'], sort_keys=True)} "
              f"all_position_flags={value['all_position_exact_flags']}"
          )
          for item in value["positions"]:
              top = item["top_policies"][0] if item["top_policies"] else None
              print(
                  "POST_REDUCTION_POSITION "
                  f"position={item['position']} "
                  f"denom_raw={item['denom_anchor']['raw_exact_fraction']:.9f} "
                  f"exact_policies={item['exact_policy_count']} "
                  f"expected_exact={item['expected_policy_exact']} "
                  f"top={json.dumps(top, sort_keys=True)}"
              )
          PY
