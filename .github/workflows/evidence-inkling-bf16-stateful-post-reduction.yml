name: Evidence Inkling stateful BF16 post-reduction composition

on:
  pull_request:
    paths:
      - "experiments/inkling/run_inkling_portable_bf16_stateful_post_reduction.py"
      - "experiments/inkling/test_inkling_portable_bf16_stateful_post_reduction.py"
      - "experiments/inkling/diagnose_inkling_bf16_router_post_reduction_denom.py"
      - "experiments/inkling/diagnose_inkling_bf16_stateful_mlp_boundary.py"
      - "experiments/inkling/diagnose_inkling_portable_bf16_stateful_sparse_layer.py"
      - "experiments/inkling/run_inkling_portable_bf16_complete_sparse_layer.py"
      - "experiments/inkling/diagnose_inkling_portable_bf16_composed_moe.py"
      - "mvp/diagnose_inkling_pre_router.py"
      - "mvp/run_inkling_fixture_reference_canonical.py"
      - "mvp/inkling_canonical_route_layer_parity.py"
      - "mvp/inkling_fixture_reference.py"
      - "mvp/inkling_remote_fixture.py"
      - "mvp/inkling_c_config.py"
      - "inkling/src/inkling_attention.c"
      - "inkling/src/inkling_layer.c"
      - "docs/OFFICIAL-ROUTER-SELECTION.json"
      - "docs/BF16-EVIDENCE.md"
      - ".github/workflows/evidence-inkling-bf16-stateful-post-reduction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkling-stateful-post-reduction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stateful-post-reduction:
    name: Layer-2 stateful post-reduction composition
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and fingerprint the pinned official stack
        run: |
          python3 -m pip install --quiet --break-system-packages \
            'torch==2.13.0' 'transformers==5.14.1'
          python3 - <<'PY'
          import torch
          assert torch.__version__.split('+', 1)[0] == "2.13.0"
          print(
              "STATEFUL_POST_REDUCTION_BACKEND "
              f"torch={torch.__version__} "
              f"dispatch={torch.backends.cpu.get_cpu_capability()} "
              f"threads={torch.get_num_threads()}"
          )
          PY

      - name: Run focused composition contracts
        run: |
          python3 -m compileall -q mvp experiments/inkling
          PYTHONPATH=mvp:experiments/inkling python3 -m unittest discover \
            -s experiments/inkling \
            -p 'test_inkling_portable_bf16_stateful_post_reduction.py' -v

      - name: Reproduce the exact layer-2 eight-token fixture plan
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          experts='2:13,19,25,26,27,30,33,39,60,67,69,81,90,91,92,95,96,112,116,117,126,131,133,140,146,150,152,166,175,217,238,247,254'
          plan="${RUNNER_TEMP}/stateful-post-reduction-plan.json"
          planned=false
          for attempt in 1 2 3 4; do
            rm -f "$plan"
            if timeout 120s python3 mvp/inkling_remote_fixture.py \
              --revision "$revision" \
              --layers 2 \
              --experts "$experts" \
              --max-total-gib 3 \
              --plan-only > "$plan"; then
              planned=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((5 << (attempt - 1)))
              echo "fixture plan attempt ${attempt} failed; retrying after ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$planned" != true ]; then
            echo "stateful fixture plan exhausted four bounded attempts" >&2
            exit 2
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          plan = json.loads((root / "stateful-post-reduction-plan.json").read_text())
          selection = json.loads(Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text())
          expected = sorted({
              expert
              for row in selection["layers"]["2"]["topk_indices"]
              for expert in row
          })
          assert sorted(plan["experts"]["2"]) == expected
          assert len(expected) == 33
          assert plan["entries"] == 87
          assert plan["payload_bytes"] == 1851934212
          assert plan["requests"] == 26
          assert plan["revision"] == selection["revision"]
          assert plan["config_sha256"] == selection["config_sha256"]
          assert plan["index_sha256"] == selection["index_sha256"]
          print(
              "STATEFUL_POST_REDUCTION_PLAN "
              f"entries={plan['entries']} payload_bytes={plan['payload_bytes']} "
              f"requests={plan['requests']} experts={len(expected)}"
          )
          PY

      - name: Extract and bind the exact layer-2 fixture
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          experts='2:13,19,25,26,27,30,33,39,60,67,69,81,90,91,92,95,96,112,116,117,126,131,133,140,146,150,152,166,175,217,238,247,254'
          fixture="${RUNNER_TEMP}/stateful-post-reduction-fixture"
          extracted=false
          for attempt in 1 2 3 4; do
            rm -rf "$fixture"
            if python3 mvp/inkling_remote_fixture.py \
              --revision "$revision" \
              --layers 2 \
              --experts "$experts" \
              --max-total-gib 3 \
              --out "$fixture" > "${RUNNER_TEMP}/stateful-post-reduction-manifest.json"; then
              extracted=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((10 << (attempt - 1)))
              echo "fixture attempt ${attempt} failed; retrying after ${delay}s" >&2
              sleep "$delay"
            fi
          done
          if [ "$extracted" != true ]; then
            echo "stateful fixture extraction exhausted four attempts" >&2
            exit 2
          fi
          python3 inkling/tools/inkling_fixture.py --fixture "$fixture" --verify

          PYTHONPATH=mvp python3 - <<PY
          import json, time
          from pathlib import Path
          import torch
          from discover_inkling_router_experts import deterministic_hidden_states, input_sha256
          from inkling_remote_fixture import HttpRangeSource, RemoteFixtureError
          root = Path("${RUNNER_TEMP}")
          config = None
          for attempt in range(4):
              try:
                  source = HttpRangeSource(
                      "https://huggingface.co/thinkingmachines/Inkling-Small",
                      "$revision",
                  )
                  config = source.file("config.json")
                  break
              except RemoteFixtureError:
                  if attempt == 3:
                      raise
                  time.sleep(10 * (2**attempt))
          assert config is not None
          (root / "config.json").write_bytes(config)
          inputs = deterministic_hidden_states(8, 4096, 19)
          selection = json.loads(Path("docs/OFFICIAL-ROUTER-SELECTION.json").read_text())
          assert input_sha256(inputs, torch.bfloat16) == selection["inputs_sha256"]
          (root / "inputs.json").write_text(
              json.dumps(inputs.tolist()) + "\n", encoding="utf-8"
          )
          PY

          PYTHONPATH=mvp python3 mvp/inkling_c_config.py \
            --model-config "${RUNNER_TEMP}/config.json" \
            --out "${RUNNER_TEMP}/c-config.json"

      # This job used to run on whatever the runner allocated and assert
      # exactness unconditionally, which made its result a coin flip: on
      # 2026-08-08 it died in the pre-expert guard with "layer 2 pre-expert
      # regression invalidates MLP diagnosis", and on 2026-08-09 the identical
      # code passed. Nothing changed but the host. The same-host reference
      # matrix explains it — oneDNN's AVX-512 path diverges at q_proj, so on an
      # AVX-512 runner the pre-expert state is already wrong and no MLP
      # conclusion downstream of it is admissible.
      #
      # ONEDNN_MAX_CPU_ISA=AVX2 is the profile that matrix measured exact. It
      # is not a workaround for the divergence and does not make the claim
      # broader: it makes the claim *scoped*, so a pass means "exact under this
      # declared profile" instead of "exact on whichever host we drew".
      - name: Execute and classify the stateful composition under the declared reference profile
        shell: bash
        env:
          ONEDNN_MAX_CPU_ISA: AVX2
        run: |
          set -euo pipefail
          PYTHONPATH=mvp:experiments/inkling python3 \
            experiments/inkling/run_inkling_portable_bf16_stateful_post_reduction.py \
            --fixture "${RUNNER_TEMP}/stateful-post-reduction-fixture" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --c-config "${RUNNER_TEMP}/c-config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --selection docs/OFFICIAL-ROUTER-SELECTION.json \
            --layers 2 \
            --dtype bfloat16 \
            --out "${RUNNER_TEMP}/stateful-post-reduction.json" > /dev/null

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "stateful-post-reduction.json").read_text()
          )
          source = result["source"]
          outcome = result["evidence_outcome"]
          profile = result["execution_profile"]
          value = result["layers"]["2"]
          decision = value["decision"]
          print(
              "STATEFUL_POST_REDUCTION_PROFILE "
              f"outcome={outcome['classification']} "
              f"host_class={profile['host_class_sha256']} "
              f"runner_id={profile['runner']['runner_id']} "
              f"profile={json.dumps(profile, sort_keys=True)}"
          )
          print(
              "STATEFUL_POST_REDUCTION_DECISION "
              f"classification={decision['classification']} "
              f"stage={decision['first_boundary_stage']} "
              f"position={decision['first_boundary_position']} "
              f"firsts={decision['first_nonexact_positions']} "
              f"backend_calls={len(value['backend_calls'])}"
          )
          for position in range(8):
              parts = [f"position={position}"]
              for stage in (
                  "routed_weight", "shared_weight", "moe_out",
                  "mlp_branch", "layer_out",
              ):
                  metric = value["stages"][stage][position]
                  parts.append(f"{stage}_raw={metric['raw_exact_fraction']:.9f}")
                  parts.append(f"{stage}_bf16={metric['bfloat16_exact_fraction']:.9f}")
                  parts.append(f"{stage}_bf16max={metric['bfloat16_max_abs']:.9g}")
              print("STATEFUL_POST_REDUCTION_POSITION " + " ".join(parts))

          assert source["production_source_unchanged"] is True
          assert source["active_router_policy"]["policy"]["flags"] == 127
          assert result["positions"] == 8
          assert len(result["weight_adapter_calls"]) == 8
          assert value["preexpert"][0]["bfloat16_exact_fraction"] == 1.0
          assert value["stages"]["routed_weight"][0]["raw_exact_fraction"] == 1.0
          assert value["stages"]["shared_weight"][0]["raw_exact_fraction"] == 1.0
          assert value["stages"]["layer_out"][0]["raw_exact_fraction"] == 1.0
          assert outcome["classification"] == "tested_stateful_sparse_mlp_ladders_exact"
          assert outcome["nonexact_layers"] == []
          assert decision["classification"] == "stateful_sparse_mlp_ladder_exact"
          PY

      # Pinning the profile above would quietly bury the defect if that were
      # the whole story, so the uncapped run happens too — recorded, never
      # gated. It is expected to fail on an AVX-512 host and to pass elsewhere;
      # either way its outcome and the host's capability land in the log and
      # the artifact, so the board stays honest about what is still broken.
      # This step must not fail the job under any outcome.
      - name: Record the uncapped native run without gating on it
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          PYTHONPATH=mvp:experiments/inkling python3 \
            experiments/inkling/run_inkling_portable_bf16_stateful_post_reduction.py \
            --fixture "${RUNNER_TEMP}/stateful-post-reduction-fixture" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --c-config "${RUNNER_TEMP}/c-config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --selection docs/OFFICIAL-ROUTER-SELECTION.json \
            --layers 2 \
            --dtype bfloat16 \
            --out "${RUNNER_TEMP}/stateful-post-reduction-native.json" \
            > "${RUNNER_TEMP}/stateful-native.log" 2>&1 || rc=$?
          echo "STATEFUL_POST_REDUCTION_NATIVE_EXIT rc=${rc}"
          tail -n 5 "${RUNNER_TEMP}/stateful-native.log" || true

          RC="$rc" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          rc = int(os.environ["RC"])
          pinned = json.loads((root / "stateful-post-reduction.json").read_text())
          capability = pinned["execution_profile"]["torch"]["cpu_capability"]
          flags = set(pinned["execution_profile"]["cpu"]["flags"] or ())
          native_path = root / "stateful-post-reduction-native.json"
          if native_path.exists():
              native = json.loads(native_path.read_text())
              outcome = native["evidence_outcome"]["classification"]
              # A native run that produces a result at all must be the same
              # host as the pinned run, or the comparison is meaningless.
              assert (
                  native["execution_profile"]["host_class_sha256"]
                  == pinned["execution_profile"]["host_class_sha256"]
              )
          else:
              outcome = "no_result_produced"
          print(
              "STATEFUL_POST_REDUCTION_NATIVE "
              f"rc={rc} outcome={outcome} "
              f"cpu_capability={capability} "
              f"avx512f={'avx512f' in flags} amx_bf16={'amx_bf16' in flags} "
              f"host_class={pinned['execution_profile']['host_class_sha256']}"
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("### Stateful post-reduction, by profile\n\n")
              out.write(
                  "- Declared reference profile "
                  "(`ONEDNN_MAX_CPU_ISA=AVX2`): `gated, passed`\n"
              )
              out.write(f"- Uncapped native: `{outcome}` (exit {rc}, not gated)\n")
              out.write(f"- Torch cpu_capability: `{capability}`\n")
              out.write(
                  f"- Host advertises avx512f: `{'avx512f' in flags}`, "
                  f"amx_bf16: `{'amx_bf16' in flags}`\n"
              )
          PY

      - name: Preserve the profiled stateful result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stateful-post-reduction-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stateful-post-reduction.json
            ${{ runner.temp }}/stateful-post-reduction-native.json
            ${{ runner.temp }}/stateful-native.log
          if-no-files-found: warn
          retention-days: 30
