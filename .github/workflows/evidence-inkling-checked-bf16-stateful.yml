name: Evidence checked-in Inkling BF16 stateful profile

on:
  pull_request:
    paths:
      - "inkling/src/inkling*.c"
      - "inkling/src/inkling*.h"
      - "experiments/inkling/checked_bf16_profile_collector.py"
      - "experiments/inkling/run_inkling_checked_bf16_stateful_layer.py"
      - ".github/workflows/evidence-inkling-checked-bf16-stateful.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkling-checked-bf16-stateful-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checked-stateful:
    name: Checked-in layer-2 BF16 across eight tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      ONEDNN_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned official stack
        run: |
          python3 -m pip install --quiet --break-system-packages \
            'torch==2.13.0' 'transformers==5.14.1'

      - name: Compile checked stateful harness
        run: |
          PYTHONPATH=inkling/tools:mvp:experiments/inkling python3 -m py_compile \
            experiments/inkling/run_inkling_checked_bf16_stateful_layer.py

      - name: Reproduce exact eight-token layer-2 fixture plan
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          experts='2:13,19,25,26,27,30,33,39,60,67,69,81,90,91,92,95,96,112,116,117,126,131,133,140,146,150,152,166,175,217,238,247,254'
          plan="${RUNNER_TEMP}/checked-stateful-plan.json"
          python3 mvp/inkling_remote_fixture.py \
            --revision "$revision" --layers 2 --experts "$experts" \
            --max-total-gib 3 --plan-only > "$plan"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          plan = json.loads((root / 'checked-stateful-plan.json').read_text())
          selection = json.loads(Path('docs/OFFICIAL-ROUTER-SELECTION.json').read_text())
          expected = sorted({e for row in selection['layers']['2']['topk_indices'] for e in row})
          assert len(expected) == 33
          assert sorted(plan['experts']['2']) == expected
          assert plan['entries'] == 87
          assert plan['payload_bytes'] == 1851934212
          assert plan['requests'] == 26
          assert plan['revision'] == selection['revision']
          assert plan['config_sha256'] == selection['config_sha256']
          assert plan['index_sha256'] == selection['index_sha256']
          print(f"CHECKED_STATEFUL_PLAN entries={plan['entries']} bytes={plan['payload_bytes']} experts={len(expected)}")
          PY

      - name: Extract CRC-verified layer-2 fixture
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          experts='2:13,19,25,26,27,30,33,39,60,67,69,81,90,91,92,95,96,112,116,117,126,131,133,140,146,150,152,166,175,217,238,247,254'
          fixture="${RUNNER_TEMP}/checked-stateful-fixture"
          extracted=false
          for attempt in 1 2 3 4; do
            rm -rf "$fixture"
            if python3 mvp/inkling_remote_fixture.py \
              --revision "$revision" --layers 2 --experts "$experts" \
              --max-total-gib 3 --out "$fixture" > "${RUNNER_TEMP}/checked-stateful-manifest.json"; then
              extracted=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((10 << (attempt - 1))); fi
          done
          test "$extracted" = true
          python3 inkling/tools/inkling_fixture.py --fixture "$fixture" --verify

          PYTHONPATH=mvp python3 - <<PY
          import json, time
          from pathlib import Path
          import torch
          from discover_inkling_router_experts import deterministic_hidden_states, input_sha256
          from inkling_remote_fixture import HttpRangeSource, RemoteFixtureError
          root = Path('${RUNNER_TEMP}')
          config = None
          for attempt in range(4):
              try:
                  config = HttpRangeSource(
                      'https://huggingface.co/thinkingmachines/Inkling-Small', '$revision'
                  ).file('config.json')
                  break
              except RemoteFixtureError:
                  if attempt == 3: raise
                  time.sleep(10 * (2**attempt))
          (root / 'config.json').write_bytes(config)
          inputs = deterministic_hidden_states(8, 4096, 19)
          selection = json.loads(Path('docs/OFFICIAL-ROUTER-SELECTION.json').read_text())
          assert input_sha256(inputs, torch.bfloat16) == selection['inputs_sha256']
          (root / 'inputs.json').write_text(json.dumps(inputs.tolist()) + '\n')
          PY
          PYTHONPATH=mvp python3 mvp/inkling_c_config.py \
            --model-config "${RUNNER_TEMP}/config.json" --out "${RUNNER_TEMP}/c-config.json"

      - name: Execute checked stateful BF16 profile
        shell: bash
        run: |
          set -uo pipefail
          err="${RUNNER_TEMP}/checked-stateful.err"
          PYTHONPATH=inkling/tools:mvp:experiments/inkling python3 \
            experiments/inkling/run_inkling_checked_bf16_stateful_layer.py \
            --fixture "${RUNNER_TEMP}/checked-stateful-fixture" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --c-config "${RUNNER_TEMP}/c-config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --selection docs/OFFICIAL-ROUTER-SELECTION.json \
            --layers 2 --out "${RUNNER_TEMP}/checked-stateful.json" \
            > /dev/null 2> "$err"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            cat "$err" >&2
            detail=$(tr '\n' ' ' < "$err" | sed 's/%/%25/g; s/\r/%0D/g')
            printf '::error file=experiments/inkling/run_inkling_checked_bf16_stateful_layer.py,title=Checked stateful BF16 failed::%s\n' "$detail"
            exit "$rc"
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'checked-stateful.json').read_text())
          outcome = result['evidence_outcome']
          value = result['layers']['2']
          decision = value['decision']
          print(
              'CHECKED_STATEFUL_DECISION '
              f"classification={outcome['classification']} "
              f"stage={decision['first_boundary_stage']} "
              f"position={decision['first_boundary_position']} "
              f"backend_calls={len(value['backend_calls'])}"
          )
          for position in range(8):
              pre = value['preexpert'][position]
              out = value['stages']['layer_out'][position]
              print(
                  'CHECKED_STATEFUL_POSITION '
                  f"position={position} pre_bf16={pre['bfloat16_exact_fraction']:.9f} "
                  f"out_raw={out['raw_exact_fraction']:.9f} out_bf16={out['bfloat16_exact_fraction']:.9f}"
              )
          assert result['source']['source_rewriting'] is False
          assert result['positions'] == 8
          assert outcome['classification'] == 'checked_in_stateful_sparse_profile_exact'
          assert decision['classification'] == 'stateful_sparse_mlp_ladder_exact'
          PY

      - name: Preserve checked stateful report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-bf16-stateful-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/checked-stateful.json
            ${{ runner.temp }}/checked-stateful.err
          if-no-files-found: warn
          retention-days: 30
