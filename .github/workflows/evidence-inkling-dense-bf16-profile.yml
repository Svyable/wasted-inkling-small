name: Measure Inkling dense BF16 profile

on:
  pull_request:
    paths:
      - "inkling/src/inkling*.c"
      - "inkling/src/inkling*.h"
      - "inkling/tools/inkling_layer_parity.py"
      - "inkling/tools/inkling_reference.py"
      - "mvp/inkling_fixture_reference.py"
      - "experiments/inkling/diagnose_inkling_native_bf16_backend.py"
      - "experiments/inkling/run_inkling_checked_bf16_sparse_layer.py"
      - "experiments/inkling/measure_inkling_dense_bf16_profile.py"
      - ".github/workflows/evidence-inkling-dense-bf16-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkling-dense-bf16-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dense-profile:
    name: Measure layer-0 dense BF16 statefully
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      ONEDNN_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned official stack
        run: |
          python3 -m pip install --quiet --break-system-packages \
            'torch==2.13.0' 'transformers==5.14.1'
          python3 -m py_compile \
            inkling/tools/inkling_reference.py \
            mvp/inkling_fixture_reference.py \
            experiments/inkling/measure_inkling_dense_bf16_profile.py

      - name: Plan exact layer-0 fixture
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          python3 mvp/inkling_remote_fixture.py \
            --revision "$revision" --layers 0 --max-total-gib 2 \
            --plan-only > "${RUNNER_TEMP}/dense-plan.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'dense-plan.json').read_text())
          selection = json.loads(Path('docs/OFFICIAL-ROUTER-SELECTION.json').read_text())
          assert plan['revision'] == selection['revision']
          assert plan['config_sha256'] == selection['config_sha256']
          assert plan['index_sha256'] == selection['index_sha256']
          assert plan['payload_bytes'] < 2 * 1024**3
          print(
              'DENSE_BF16_PLAN '
              f"entries={plan['entries']} payload_bytes={plan['payload_bytes']} "
              f"requests={plan['requests']}"
          )
          PY

      - name: Extract CRC-verified layer-0 fixture and inputs
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          fixture="${RUNNER_TEMP}/dense-fixture"
          extracted=false
          for attempt in 1 2 3 4; do
            rm -rf "$fixture"
            if python3 mvp/inkling_remote_fixture.py \
              --revision "$revision" --layers 0 --max-total-gib 2 \
              --out "$fixture" > "${RUNNER_TEMP}/dense-manifest.json"; then
              extracted=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((10 << (attempt - 1))); fi
          done
          test "$extracted" = true
          python3 inkling/tools/inkling_fixture.py --fixture "$fixture" --verify

          PYTHONPATH=mvp python3 - <<PY
          import json, time
          from pathlib import Path
          import torch
          from discover_inkling_router_experts import deterministic_hidden_states, input_sha256
          from inkling_remote_fixture import HttpRangeSource, RemoteFixtureError
          root = Path('${RUNNER_TEMP}')
          config = None
          for attempt in range(4):
              try:
                  config = HttpRangeSource(
                      'https://huggingface.co/thinkingmachines/Inkling-Small', '$revision'
                  ).file('config.json')
                  break
              except RemoteFixtureError:
                  if attempt == 3: raise
                  time.sleep(10 * (2**attempt))
          assert config is not None
          (root / 'config.json').write_bytes(config)
          inputs = deterministic_hidden_states(8, 4096, 19)
          selection = json.loads(Path('docs/OFFICIAL-ROUTER-SELECTION.json').read_text())
          assert input_sha256(inputs, torch.bfloat16) == selection['inputs_sha256']
          (root / 'inputs.json').write_text(json.dumps(inputs.tolist()) + '\n')
          PY
          PYTHONPATH=mvp python3 mvp/inkling_c_config.py \
            --model-config "${RUNNER_TEMP}/config.json" --out "${RUNNER_TEMP}/c-config.json"

      - name: Measure dense BF16 hypothesis
        shell: bash
        run: |
          set -uo pipefail
          err="${RUNNER_TEMP}/dense-bf16.err"
          PYTHONPATH=inkling/tools:mvp:experiments/inkling python3 \
            experiments/inkling/measure_inkling_dense_bf16_profile.py \
            --fixture "${RUNNER_TEMP}/dense-fixture" \
            --model-config "${RUNNER_TEMP}/config.json" \
            --c-config "${RUNNER_TEMP}/c-config.json" \
            --inputs "${RUNNER_TEMP}/inputs.json" \
            --out "${RUNNER_TEMP}/dense-bf16.json" \
            > /dev/null 2> "$err"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            cat "$err" >&2
            detail=$(tr '\n' ' ' < "$err" | sed 's/%/%25/g; s/\r/%0D/g')
            printf '::error file=experiments/inkling/measure_inkling_dense_bf16_profile.py,title=Dense BF16 measurement failed::%s\n' "$detail"
            exit "$rc"
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'dense-bf16.json').read_text())
          decision = result['decision']
          print(
              'DENSE_BF16_DECISION '
              f"classification={decision['classification']} "
              f"first_output={decision['first_nonexact_output_position']} "
              f"first_final_stage={decision['first_nonexact_final_token_stage']} "
              f"backend_calls={len(result['backend_calls'])}"
          )
          for position, value in enumerate(result['outputs']):
              print(
                  'DENSE_BF16_OUTPUT '
                  f"position={position} raw={value['raw_exact_fraction']:.9f} "
                  f"bf16={value['bfloat16_exact_fraction']:.9f}"
              )
          assert result['source']['production_source_unchanged'] is True
          assert result['source']['source_rewriting'] is True
          # A mismatch is a legitimate measurement outcome and must not be
          # converted into a false CI failure. The JSON and summary name it.
          PY

      - name: Preserve dense BF16 measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dense-bf16-measurement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dense-bf16.json
            ${{ runner.temp }}/dense-bf16.err
          if-no-files-found: warn
          retention-days: 30