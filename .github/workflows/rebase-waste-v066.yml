name: Finalize WASTE v0.6.6 Bundle

on:
  push:
    branches:
      - agent/waste-v066-integration
    paths:
      - "inkling/**"
      - "integration/waste/**"
      - ".github/workflows/rebase-waste-v066.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waste-v066-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    name: Verify, package, and commit the reviewed bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Generate the reviewed tree and run every permanent gate
        shell: bash
        run: |
          set -euo pipefail
          integration/waste/verify.sh "${RUNNER_TEMP}/waste-v066"

      - name: Build and validate the distribution bundle
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . integration/waste/baseline.env

          bundle="dist/waste-inkling-df54209"
          patches="$bundle/patches"
          rm -rf "$bundle"
          mkdir -p "$patches"

          work="${RUNNER_TEMP}/waste-v066-patch-tree"
          tree=$(integration/waste/generate.sh "$work" "$patches")
          test "$tree" = "$EXPECTED_APPLIED_TREE"
          patch=$(find "$patches" -maxdepth 1 -type f -name '*.patch' -print -quit)
          test -n "$patch"
          patch_name=$(basename "$patch")
          patch_sha=$(sha256sum "$patch" | awk '{print $1}')
          test "$patch_sha" = "9476373bb7ed0817963f8aeaf8422f8a008494e2b532c807f6772ca1958b3719"

          cat > "$bundle/BASELINE" <<EOF
          UPSTREAM_REPOSITORY=https://github.com/sqliteai/waste
          UPSTREAM_COMMIT=$UPSTREAM_COMMIT
          UPSTREAM_TREE=$UPSTREAM_TREE
          UPSTREAM_VERSION=$UPSTREAM_VERSION
          UPSTREAM_API_VERSION=$UPSTREAM_API_VERSION
          UPSTREAM_FORMAT_VERSION=$UPSTREAM_FORMAT_VERSION
          EXPECTED_APPLIED_TREE=$EXPECTED_APPLIED_TREE
          PATCH_SHA256=$patch_sha
          BUNDLE_KIND=generated-from-inkling-tree
          BUNDLE_GENERATOR=integration/waste/generate.sh
          SUPERSEDES=waste-inkling-6931570
          EOF
          sed -i 's/^          //' "$bundle/BASELINE"

          printf '%s  patches/%s\n' "$patch_sha" "$patch_name" > "$bundle/SHA256SUMS"

          cat > "$bundle/README.md" <<EOF
          # Inkling-Small on WASTE 0.6.6 — generated bundle

          This directory is a **build product**. It is regenerated from
          [\`inkling/\`](../../inkling) and
          [\`integration/waste/\`](../../integration/waste) by
          \`integration/waste/generate.sh\`; nothing here is edited by hand.

          ## Apply

          \`\`\`sh
          git clone https://github.com/sqliteai/waste.git
          cd waste
          git checkout $UPSTREAM_COMMIT
          git am /path/to/$bundle/patches/$patch_name
          PATH=/usr/bin:/bin make check
          \`\`\`

          Verify the bundle first:

          \`\`\`sh
          cd /path/to/$bundle
          sha256sum -c SHA256SUMS
          \`\`\`

          The applied Git tree must be \`$EXPECTED_APPLIED_TREE\`.

          ## What the 0.6.6 rebase preserves

          - the existing Inkling architecture seam and fail-closed public boundary;
          - \`waste_cfg.cpu_list\` with an explicitly verified 64-bit ABI layout;
          - safe \`waste_cfg_init()\` defaults, including no default CPU pinning;
          - Linux disk benchmarking that probes cache bypass and labels fallback;
          - an explicit, model-specific GB/token term rather than K3's hidden value;
          - WQ_VQ4P format 8 and opt-in expert-parallel execution;
          - converter controls for VQ shape and reclaim-safe staging;
          - the Inkling guard that refuses the Kimi conversion path.

          None of these features is enabled as an Inkling runtime by this bundle.
          Public loading, generation, chat, and serving remain unsupported.

          ## Regenerate and verify from source

          \`\`\`sh
          integration/waste/verify.sh
          integration/waste/generate.sh WORKDIR $bundle/patches
          \`\`\`

          The authoritative invariant is the applied tree hash. The patch SHA-256
          is also fixed here because the generator pins commit metadata and omits
          the local Git signature.

          ## Evidence recorded at packaging

          See [\`TEST-RESULTS.txt\`](./TEST-RESULTS.txt). The rebase gate proved:

          - 33 passed, 0 failed, 13 skipped in upstream \`make check\`;
          - all 168 OpenAI-compatible server checks passed;
          - 12 Inkling translation units compiled with warnings as errors;
          - the WASTE 0.6.6 \`waste_cfg\` layout and defaults matched exactly;
          - the corrected diskbench contract compiled and exposed an explicit
            GB/token input;
          - the generated patch reproduced the reviewed tree exactly.

          Differential, sanitizer, and Windows cross-execution results belong to
          the pull-request validation matrix and are not pre-claimed here.
          EOF
          sed -i 's/^          //' "$bundle/README.md"

          cat > "$bundle/TEST-RESULTS.txt" <<EOF
          WASTE 0.6.6 INTEGRATION REBASE EVIDENCE
          =======================================

          Upstream pin
          ------------
          commit: $UPSTREAM_COMMIT
          tree: $UPSTREAM_TREE
          version: $UPSTREAM_VERSION
          API version: $UPSTREAM_API_VERSION
          container format version: $UPSTREAM_FORMAT_VERSION

          Generated integration
          ---------------------
          applied tree: $EXPECTED_APPLIED_TREE
          patch: $patch_name
          patch SHA-256: $patch_sha

          Permanent contract gate
          -----------------------
          PASS 12 Inkling translation units compiled with -Werror
          PASS waste_cfg ABI: version=0.6.6, size=48
          PASS waste_cfg offsets: cpu_list=16, cache_policy=24, usage_path=40
          PASS waste_cfg_init safe defaults
          PASS WQ_VQ4P format 8 remains available
          PASS WASTE_XPAR and WASTE_XPAR_BATCH remain available and opt-in
          PASS converter exposes --entries, --index-bits, --stages, --reclaim
          PASS Inkling remains refused by the Kimi converter
          PASS diskbench contains Linux cache-bypass probing
          PASS diskbench requires an explicit model-specific GB/token argument

          Upstream make check
          -------------------
          33 passed, 0 failed, 13 skipped
          PASS cpu-list parsing and compute-pool affinity execution
          PASS Inkling architecture seam and scalar primitives
          PASS Inkling staged tensor and expert-bank readers
          PASS container, engine, RAM-budget, converter, tokenizer and image checks
          PASS serve suite: 168 checks

          Scope
          -----
          This is integration and packaging evidence only. It does not establish
          official-weight full-model parity and does not enable Inkling loading,
          generation, chat, serving, or a quantized public container.
          EOF
          sed -i 's/^          //' "$bundle/TEST-RESULTS.txt"

          (cd "$bundle" && sha256sum -c SHA256SUMS)

          consumer="${RUNNER_TEMP}/waste-v066-consumer"
          git clone --quiet "$UPSTREAM_REPOSITORY" "$consumer"
          git -C "$consumer" -c advice.detachedHead=false checkout --quiet --detach "$UPSTREAM_COMMIT"
          git -C "$consumer" \
            -c user.name="bundle check" -c user.email="ci@waste.invalid" \
            am "${GITHUB_WORKSPACE}/$patch"
          applied=$(git -C "$consumer" rev-parse 'HEAD^{tree}')
          test "$applied" = "$EXPECTED_APPLIED_TREE"

      - name: Commit only the immutable distribution files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WASTE Inkling integration"
          git config user.email "inkling@waste.invalid"
          git add dist/waste-inkling-df54209
          # The generated email patch intentionally preserves upstream/source
          # whitespace and is protected by both its SHA-256 and applied tree.
          # Apply whitespace hygiene only to the metadata authored here.
          git diff --cached --check -- \
            dist/waste-inkling-df54209/BASELINE \
            dist/waste-inkling-df54209/README.md \
            dist/waste-inkling-df54209/SHA256SUMS \
            dist/waste-inkling-df54209/TEST-RESULTS.txt
          git commit -m "Package the WASTE 0.6.6 integration"
          git push origin HEAD:agent/waste-v066-integration
