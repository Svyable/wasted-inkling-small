name: Rebase WASTE v0.6.6

on:
  push:
    branches:
      - agent/waste-v066-integration
    paths:
      - "inkling/**"
      - "integration/waste/**"
      - ".github/workflows/rebase-waste-v066.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waste-v066-rebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Verify and package the rebased integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the reviewed tree and run every permanent gate
        shell: bash
        run: |
          set -euo pipefail
          integration/waste/verify.sh "${RUNNER_TEMP}/waste-v066"

      - name: Generate the deterministic patch artifact
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . integration/waste/baseline.env
          work="${RUNNER_TEMP}/waste-v066-patch-tree"
          out="${RUNNER_TEMP}/waste-v066-patches"
          tree=$(integration/waste/generate.sh "$work" "$out")
          test "$tree" = "$EXPECTED_APPLIED_TREE"
          patch=$(find "$out" -maxdepth 1 -type f -name '*.patch' -print -quit)
          test -n "$patch"
          sha=$(sha256sum "$patch" | awk '{print $1}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "patch=$(basename "$patch")" >> "$GITHUB_OUTPUT"
          echo "generated $(basename "$patch") sha256=$sha tree=$tree"

      - name: Upload the generated patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: waste-inkling-df54209-patch
          path: ${{ runner.temp }}/waste-v066-patches/*.patch
          if-no-files-found: error
          retention-days: 7

      - name: Summarize the immutable outputs
        shell: bash
        run: |
          echo "applied_tree=${{ steps.patch.outputs.tree }}"
          echo "patch=${{ steps.patch.outputs.patch }}"
          echo "patch_sha256=${{ steps.patch.outputs.sha256 }}"
