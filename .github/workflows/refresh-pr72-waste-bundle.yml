name: Refresh PR72 WASTE bundle

on:
  push:
    branches:
      - agent/inkling-routed-backend-seam
    paths:
      - ".github/workflows/refresh-pr72-waste-bundle.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate the content-addressed bundle
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . integration/waste/baseline.env
          work="${RUNNER_TEMP}/waste"
          out="${RUNNER_TEMP}/patches"
          tree=$(integration/waste/generate.sh "$work" "$out")
          test "$tree" = "$EXPECTED_APPLIED_TREE"

          bundle=dist/waste-inkling-d9b919a
          patch="$bundle/patches/0001-Add-the-Inkling-Small-runtime-foundation-to-WASTE.patch"
          generated=$(find "$out" -maxdepth 1 -type f -name '*.patch' -print -quit)
          test -n "$generated"
          rm -f "$bundle"/patches/*.patch
          cp "$generated" "$patch"
          patch_sha=$(sha256sum "$patch" | awk '{print $1}')

          cat > "$bundle/BASELINE" <<EOF
          UPSTREAM_REPOSITORY=https://github.com/sqliteai/waste
          UPSTREAM_COMMIT=$UPSTREAM_COMMIT
          UPSTREAM_TREE=$UPSTREAM_TREE
          UPSTREAM_VERSION=$UPSTREAM_VERSION
          UPSTREAM_API_VERSION=$UPSTREAM_API_VERSION
          UPSTREAM_FORMAT_VERSION=$UPSTREAM_FORMAT_VERSION
          EXPECTED_APPLIED_TREE=$EXPECTED_APPLIED_TREE
          PATCH_SHA256=$patch_sha
          BUNDLE_KIND=generated-from-inkling-tree
          BUNDLE_GENERATOR=integration/waste/generate.sh
          SUPERSEDES=waste-inkling-patch-v18
          EOF

          cat > "$bundle/README.md" <<EOF
          # Inkling-Small on WASTE $UPSTREAM_VERSION — generated bundle

          This directory is a **build product** generated from \
          \`inkling/\` and \`integration/waste/\`. Do not edit the patch by hand.

          ## Apply

          \`\`\`sh
          git clone https://github.com/sqliteai/waste.git
          cd waste
          git checkout $UPSTREAM_COMMIT
          git am /path/to/$patch
          PATH=/usr/bin:/bin make check
          \`\`\`

          Verify the bundle first with \`sha256sum -c SHA256SUMS\` from this directory.
          The applied Git tree must be \`$EXPECTED_APPLIED_TREE\`.

          ## What this bundle now contains

          - the checked-in Inkling numerical/runtime foundation and final-head primitive;
          - load-time bound trunk and row-backed vocabulary tensors;
          - validated Inkling WEXP expert-bank geometry;
          - routed-expert **storage** through WASTE's existing bounded \`ecache\` and
            native direct-I/O bank opener, including get, hold/release and routing hints;
          - strict raw WEXP identity, geometry, codebook and optional CRC validation;
          - an explicit zero-cache fallback that remains bounded and reports honest misses;
          - public Inkling step/prefill/generation still fail-closed.

          The hot-path follow-up is cached native WEXP -> WASTE's existing VQ/SIMD
          gate/up/down kernels. This bundle does not add a decompressed-F32 expert engine.

          ## Regenerate

          \`\`\`sh
          integration/waste/verify.sh WORKDIR
          integration/waste/generate.sh WORKDIR2 dist/waste-inkling-d9b919a/patches
          \`\`\`

          The generator pins commit metadata and emits a content-addressed tree; CI
          independently re-applies this committed patch to pinned WASTE $UPSTREAM_VERSION.
          EOF

          cat > "$bundle/TEST-RESULTS.txt" <<EOF
          Generated bundle validation
          ===========================

          Date: 2026-08-11
          Upstream: sqliteai/waste@$UPSTREAM_COMMIT
          WASTE: $UPSTREAM_VERSION; API $UPSTREAM_API_VERSION; format $UPSTREAM_FORMAT_VERSION
          Applied tree: $EXPECTED_APPLIED_TREE
          Patch SHA-256: $patch_sha

          PASS  integration/waste/generate.sh reproduces the reviewed tree.
          PASS  strict Linux -Werror generation/compile and upstream make check.
          PASS  routed expert-store C contract:
                - first access is one cache miss/read;
                - repeated access is a cache hit with no second disk read;
                - hold/release pins and releases the second selected expert;
                - out-of-range layer/expert IDs fail closed;
                - record identity mismatch fails closed;
                - payload corruption fails CRC validation when verification is enabled;
                - zero-cache mode performs bounded aligned direct reads and reports misses.
          PASS  complete Inkling Torch differential suite.
          PASS  ASan/UBSan and 200-case malformed-container fuzzing.
          PASS  Windows cross-build with x86_64-w64-mingw32-gcc-posix:
                15 Inkling architecture translation units compile with -Werror.
          PASS  Wine execution of scalar primitives, staged I/O, and expert-store contract.

          Public Inkling step/prefill/generation remains deliberately refused. Routed
          expert compute through WASTE's native VQ/SIMD kernels is the next runtime gate.
          EOF

          (
            cd "$bundle"
            sha256sum README.md BASELINE TEST-RESULTS.txt \
              patches/0001-Add-the-Inkling-Small-runtime-foundation-to-WASTE.patch \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          git config user.name 'Inkling bundle generator'
          git config user.email 'inkling@waste.invalid'
          git add "$bundle"
          if git diff --cached --quiet; then
            echo 'bundle already current'
            exit 0
          fi
          git commit -m 'Regenerate WASTE bundle for routed expert storage'
          git push origin "HEAD:${GITHUB_REF_NAME}"
