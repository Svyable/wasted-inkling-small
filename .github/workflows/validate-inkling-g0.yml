name: Validate Inkling G0 harness

on:
  pull_request:
    paths:
      - "mvp/**"
      - "docs/MVP-READINESS.md"
      - "docs/CONFIG-SCHEMA-RESOLUTION.md"
      - "docs/REMOTE-FIXTURES.md"
      - ".github/workflows/validate-inkling-g0.yml"
  push:
    branches: [main]
    paths:
      - "mvp/**"
      - "docs/MVP-READINESS.md"
      - "docs/CONFIG-SCHEMA-RESOLUTION.md"
      - "docs/REMOTE-FIXTURES.md"
      - ".github/workflows/validate-inkling-g0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the tested Inkling stack
        run: |
          python3 -m pip install --quiet --break-system-packages \
            torch 'transformers==5.14.1'
      - name: Compile and run every G0 evidence test
        run: |
          python3 -m compileall -q mvp
          PYTHONPATH=mvp python3 -m unittest discover \
            -s mvp -p 'test_inkling_*.py' -v

  release-plan:
    name: Plan immutable release fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan layers 0, 2, and 5 from release headers
        shell: bash
        run: |
          set -euo pipefail
          revision=21152b5312c653be115f33a8342759064144e281
          python3 mvp/inkling_remote_fixture.py \
            --revision "$revision" \
            --layers 0,2,5 \
            --experts '2:4,17,39,88,143,221;5:1,8,22,64,150,201' \
            --max-total-gib 8 \
            --plan-only > fixture-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("fixture-plan.json").read_text())
          assert plan["model_id"] == "thinkingmachines/Inkling-Small", plan
          assert plan["revision"] == "21152b5312c653be115f33a8342759064144e281", plan
          assert plan["layers"] == [0, 2, 5], plan
          assert plan["experts"] == {
              "2": [4, 17, 39, 88, 143, 221],
              "5": [1, 8, 22, 64, 150, 201],
          }, plan
          assert 0 < plan["entries"] < 100, plan
          assert 0 < plan["payload_bytes"] <= 8 << 30, plan
          assert 0 < plan["metadata_bytes_read"] < 64 << 20, plan
          assert plan["shards"], plan
          assert len(plan["config_sha256"]) == 64, plan
          assert len(plan["index_sha256"]) == 64, plan
          print(json.dumps(plan, indent=2, sort_keys=True))
          PY
