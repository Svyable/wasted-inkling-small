name: Validate WASTE Inkling

on:
  pull_request:
    paths:
      - "inkling/**"
      - "integration/**"
      - "dist/**"
      - ".github/workflows/validate-waste-inkling.yml"
  push:
    branches:
      - main
    paths:
      - "inkling/**"
      - "integration/**"
      - "dist/**"
      - ".github/workflows/validate-waste-inkling.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-regress:
    name: Generate, prove the tree, regress
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # verify.sh is the whole gate: it regenerates the patch from inkling/
      # plus the overlay fragments, refuses to continue unless the tree hash
      # equals the reviewed one, compiles every Inkling unit with -Werror, and
      # runs the upstream suite.
      - name: Generate, verify the tree, compile strict, run make check
        shell: bash
        run: integration/waste/verify.sh "${RUNNER_TEMP}/waste"

      # The committed bundle must produce the reviewed tree. The gate is the
      # applied tree hash, not the patch bytes: `format-patch` output varies
      # with the local Git version, so a byte comparison fails on a runner
      # whose Git differs from the committer's without anything being stale.
      # This check is also exactly what a consumer does.
      - name: Committed bundle applies to the reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . integration/waste/baseline.env
          (cd dist/waste-inkling-6931570 && sha256sum -c SHA256SUMS)
          work="${RUNNER_TEMP}/waste-bundle"
          git clone --quiet "$UPSTREAM_REPOSITORY" "$work"
          git -C "$work" -c advice.detachedHead=false checkout --quiet --detach "$UPSTREAM_COMMIT"
          git -C "$work" \
            -c user.name="bundle check" -c user.email="ci@waste.invalid" \
            am "${GITHUB_WORKSPACE}"/dist/waste-inkling-6931570/patches/*.patch
          applied=$(git -C "$work" rev-parse 'HEAD^{tree}')
          if [ "$applied" != "$EXPECTED_APPLIED_TREE" ]; then
            echo "dist/ is stale: applies to $applied, sources produce $EXPECTED_APPLIED_TREE" >&2
            echo "regenerate with integration/waste/generate.sh" >&2
            exit 1
          fi
          echo "committed bundle applies to $applied"

      - name: Dependency-light Python validation
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/waste"
          python3 -m compileall -q "$work/tools" "$work/tests"
          cd "$work"
          python3 tests/test_inspect_inkling.py
          python3 tests/test_inkling_plan.py
          python3 tests/test_inkling_release.py
          python3 tests/test_inkling_config_c.py
          python3 tests/test_inkling_fixture.py
          python3 tests/test_inkling_throughput.py
          python3 tests/test_inkling_cache_trace.py
          python3 tests/test_inkling_cache_bench.py
          python3 tests/test_inkling_expert_bench.py
          python3 tests/test_inkling_serve.py

  differential:
    name: Torch differential suite
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the tree
        shell: bash
        run: |
          set -euo pipefail
          WASTE_VERIFY_SKIP_CHECK=1 integration/waste/verify.sh "${RUNNER_TEMP}/waste"

      # The 99 private-runtime tests were recorded once and then quoted for
      # several bundles without being re-run. This job is why they are evidence
      # again: C-versus-PyTorch parity for the router, relative bias, short
      # convolution, attention, the complete layer, and the staged runtime.
      - name: Install torch and numpy
        shell: bash
        run: python3 -m pip install --quiet --break-system-packages torch numpy

      - name: Run the complete Inkling Python suite
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/waste"
          python3 -m unittest discover -s tests -p "test_ink*.py" -t .
          python3 -m unittest tests.test_inspect_inkling tests.test_convert_inkling

  sanitizers:
    name: Sanitizers and container fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the tree
        shell: bash
        run: |
          set -euo pipefail
          WASTE_VERIFY_SKIP_CHECK=1 integration/waste/verify.sh "${RUNNER_TEMP}/waste"

      - name: Run ASan and UBSan
        shell: bash
        run: PATH=/usr/bin:/bin make -C "${RUNNER_TEMP}/waste" asan

      - name: Fuzz malformed containers under sanitizers
        shell: bash
        run: PATH=/usr/bin:/bin make -C "${RUNNER_TEMP}/waste" fuzz-asan FUZZ_RUNS=200

  windows:
    name: Windows cross-build and execution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the tree
        shell: bash
        run: |
          set -euo pipefail
          WASTE_VERIFY_SKIP_CHECK=1 integration/waste/verify.sh "${RUNNER_TEMP}/waste"

      - name: Install MinGW and Wine
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 wine wine64

      # inkling_stage_reader.c carries a whole second I/O implementation for
      # Windows — ReadFile with OVERLAPPED — that no job compiled until this
      # one. Every Inkling unit must build for the target with warnings as
      # errors, exactly as the native build does.
      - name: Cross-compile every Inkling unit with -Werror
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/waste"
          objects="$(mktemp -d)"
          units=0
          for source in "$work"/src/arch.c "$work"/src/inkling*.c; do
            x86_64-w64-mingw32-gcc-posix -std=gnu11 -Wall -Wextra -Werror \
              -I"$work/src" -c "$source" -o "$objects/$(basename "${source%.c}").o"
            units=$((units + 1))
          done
          test "$units" -eq 12
          echo "cross-compiled $units Inkling translation units"

      - name: Build the Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin make -C "${RUNNER_TEMP}/waste" \
            CC=x86_64-w64-mingw32-gcc-posix test_inkling.exe test_inkling_io.exe

      # Compiling proves the branch parses. Running it proves the positional
      # reads actually work, which is the part that had never been true.
      # WINEPREFIX must sit under a directory this job owns. Wine refuses to
      # create a configuration directory beneath one it does not — "/tmp is
      # not owned by you" — which is invisible when you develop as root and
      # fatal on a runner. RUNNER_TEMP is owned by the runner user.
      - name: Run the Inkling C tests under Wine
        shell: bash
        env:
          WINEDEBUG: "-all"
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/waste"
          export WINEPREFIX="${RUNNER_TEMP}/wineprefix"
          scratch="${RUNNER_TEMP}/winescratch"
          mkdir -p "$scratch"
          wineboot --init >/dev/null 2>&1 || true
          (cd "$work" && wine ./test_inkling.exe | grep -q "^INKLING OK")
          (cd "$work" && wine ./test_inkling_io.exe "Z:$scratch" | grep -q "^INKLING IO OK")
          echo "Inkling scalar primitives and staged readers pass on Windows"
